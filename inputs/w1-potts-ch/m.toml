# THIS IS CC's m.toml (Kernel V8's M for ONE input: what was measured and how).
# It is NOT the toolset's m.toml (scratch/compass-toolset/m.toml, the study log).
# inputs/w1-potts/m.toml - W1 frozen data (data/w1): Potts at exact K_c, q 2,3,4,5,7, DECIMATION block map
# (W2 is plurality3); instruments as w2-potts-2 (plan 0866 X9)
schema = 1
kind = "input"
id = "w1-potts-ch"
instruments = ["across", "stability", "two_start", "fluct"]

[obtained]
"2" = "truth"
"3" = "truth"
"4" = "truth"
"5" = "truth"
"7" = "truth"

[axes]
point = ["2", "3", "4", "5", "7"]
size = [27, 81, 243]
starts = ["random", "ordered"]
main_start = "random"

[observable]
name = "g1 of the plurality block lattice"
definition = "open-pair nearest-neighbour correlation at final size 9 (final level only)"
levels = [1, 1, 1]
final_size = 9

[block_map]
name = "decimation3"
factor = 3
keeps = "the centre site of each 3x3 block: a deterministic decimation, no ties"
discards = "every other site of the block, hence the within-block colour spread"

[relations.size]
template = "chain"
axis = "size"
provenance = "Coupling"
direction_from = "the declared blocking map at equal final size"

[relations.start]
template = "pair"
axis = "starts"
pairs = [["random", "ordered"]]
provenance = "Coupling"
direction_from = "two runs at the same point differing only in the declared initial state"

[interval]
method = "chains"
m = 10
r = 2
alpha = 0.021484375
chain_root = "root_0937C"

[eps]
y = 0.25
two_start = 0.01

[conjugate]
observable = "E"
conjugate_to = "K (nn coupling)"
hamiltonian_knowledge = true

[two_start]
observable = "Q"
definition = "E = sum of nn bond indicators per snapshot / the declared bond count 2 L^2"
unit_scale = { "27" = 1458, "81" = 13122, "243" = 118098 }

[kernel]
uses = ["A"]

[data]
format = "npz-v1"

