# THIS IS CC's m.toml (Kernel V8's M for ONE input: what was measured and how).
# It is NOT the toolset's m.toml (scratch/compass-toolset/m.toml, the study log).
# inputs/x5n-bilayer-2/m.toml - x5n-bilayer (plan 0865 S3) with the needle read on EACH start (plan 0867 P1): the needle_o
# instrument reads the ORDERED start's own level stacks at the matched sizes (243, 81), so needle_pair (tables/v03-rules)
# has both starts' needle. Same blocks, seed, resample draws and eps as x5n-bilayer (the frozen input cannot change);
# only the GL arrays of the ordered files at L = 81 and 243, and the needle_o instrument, are added.
schema = 1
kind = "input"
id = "x5n-bilayer-2"
instruments = ["needle", "across", "stability", "two_start", "fluct", "needle_o"]

[obtained]
"0.0" = "navigated"
"0.1" = "navigated"
"0.3" = "navigated"

[axes]
point = ["0.0", "0.1", "0.3"]
size = [27, 81, 243]
starts = ["random", "ordered"]
main_start = "random"

[observable]
name = "g1 of the s layer's majority block lattice"
definition = """open-pair nearest-neighbour correlation of each block lattice of the s layer \
(toolset tools/flow.py), every level down to final size 9; the random start \
is the RANDOM role, the ordered start (s = t = +1) the ORDERED role"""
levels = [2, 3, 4]
final_size = 9

[block_map]
name = "majority3"
factor = 3
keeps = "the sign of the local majority; tie-free"
discards = "the magnitude of the local magnetisation"

[relations.size]
template = "chain"
axis = "size"
provenance = "Coupling"
direction_from = "the declared blocking map: one more blocking step relates L to L/3"

[relations.matched]
template = "matched"
axis = "size"
big = 243
small = 81
provenance = "Coupling"
direction_from = "one extra declared blocking step at equal block-lattice size ([P2] relations)"

[relations.start]
template = "pair"
axis = "starts"
pairs = [["random", "ordered"]]
provenance = "Coupling"
direction_from = "two runs at the same point differing only in the declared initial state"

[sinks]
ordered = 1.0
disordered = 0.0

[interval]
method = "block"
b = 1600
resamples = 400
level = 0.95
seed = 65

[eps]
step = 0.01
sink = 0.02
y = 0.25
two_start = 0.01

[conjugate]
observable = "E"
conjugate_to = "K (intra-layer coupling; E = sum over bonds of s s + t t)"
hamiltonian_knowledge = true

[two_start]
observable = "Q"
definition = """E = sum over bonds of s s + t t per snapshot (O column 0) / the declared \
bond count of the bilayer, 4 L^2 (two layers of 2 L^2)"""
unit_scale = { "27" = 2916, "81" = 26244, "243" = 236196 }

[kernel]
uses = ["A"]

[data]
format = "npz-v1"

[[data.files]]
point = "0.0"
size = 27
start = "random"
path = "x5n/g0.0/g0.0-L27-random.npz"
arrays.G = { key = "G", level = 1 }
arrays.E = { key = "O", level = 0 }
arrays.Q = { key = "O", level = 0 }

[[data.files]]
point = "0.0"
size = 27
start = "ordered"
path = "x5n/g0.0/g0.0-L27-ordered.npz"
arrays.Q = { key = "O", level = 0 }

