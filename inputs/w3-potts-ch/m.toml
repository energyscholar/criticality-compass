# THIS IS CC's m.toml (Kernel V8's M for ONE input: what was measured and how).
# It is NOT the toolset's m.toml (scratch/compass-toolset/m.toml, the study log).
# inputs/w3-potts/m.toml - W3 frozen data (data/w3): Potts at exact K_c, q 4,5,6, L 81/243/729, plurality3 block map;
# instruments as w2-potts-2 (plan 0866 X9). Hand-written: new input --like cannot change the size axis
schema = 1
kind = "input"
id = "w3-potts-ch"
instruments = ["across", "stability", "two_start", "fluct"]

[obtained]
"4" = "truth"
"5" = "truth"
"6" = "truth"

[axes]
point = ["4", "5", "6"]
size = [81, 243, 729]
starts = ["random", "ordered"]
main_start = "random"

[observable]
name = "g1 of the plurality block lattice"
definition = "open-pair nearest-neighbour correlation at final size 9 (final level only)"
levels = [1, 1, 1]
final_size = 9

[block_map]
name = "plurality3-stochastic"
factor = 3
keeps = "the most frequent colour of each 3x3 block (a declared probabilistic map)"
discards = "the within-block colour spread; ties broken uniformly at random"

[relations.size]
template = "chain"
axis = "size"
provenance = "Coupling"
direction_from = "the declared blocking map at equal final size"

[relations.start]
template = "pair"
axis = "starts"
pairs = [["random", "ordered"]]
provenance = "Coupling"
direction_from = "two runs at the same point differing only in the declared initial state"

[interval]
method = "chains"
m = 10
r = 2
alpha = 0.021484375
chain_root = "root_0937C"

[eps]
y = 0.25
two_start = 0.01

[conjugate]
observable = "E"
conjugate_to = "K (nn coupling)"
hamiltonian_knowledge = true

[two_start]
observable = "Q"
definition = "E = sum of nn bond indicators per snapshot / the declared bond count 2 L^2"
unit_scale = { "81" = 13122, "243" = 118098, "729" = 1062882 }

[kernel]
uses = ["A"]

[data]
format = "npz-v1"

