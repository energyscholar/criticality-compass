# THIS IS CC's m.toml (Kernel V8's M for ONE input: what was measured and how).
# It is NOT the toolset's m.toml (scratch/compass-toolset/m.toml, the study log).
# inputs/x2-xy-line-2/m.toml - like x2-xy-line
schema = 1
kind = "input"
id = "x2-xy-line-2"
instruments = ["needle", "across", "stability", "two_start", "fluct"]

[obtained]
"0.5" = "truth"
"0.6" = "truth"
"0.7" = "truth"
"0.89294" = "truth"
"1.1" = "truth"

[axes]
point = ["0.5", "0.6", "0.7", "0.89294", "1.1"]
size = [27, 81, 243]
starts = ["random", "ordered"]
main_start = "random"

[observable]
name = "g1_xy of the sum-and-normalise block lattice"
definition = """open-pair nearest-neighbour correlation s_i . s_j of the block unit vectors, \
every level down to final size 9 (matched across sizes)"""
levels = [2, 3, 4]
final_size = 9

[block_map]
name = "sum-and-normalise3"
factor = 3
keeps = "the direction of each 3x3 block's net moment (a unit vector)"
discards = "the magnitude of the block's moment and the arrangement inside the block"

[relations.size]
template = "chain"
axis = "size"
provenance = "Coupling"
direction_from = "the declared blocking map: one more blocking step relates L to L/3"

[relations.matched]
template = "matched"
axis = "size"
big = 243
small = 81
provenance = "Coupling"
direction_from = "one extra declared blocking step at equal block-lattice size ([P2] relations)"

[relations.start]
template = "pair"
axis = "starts"
pairs = [["random", "ordered"]]
provenance = "Coupling"
direction_from = "two runs at the same point differing only in the declared initial state"

[sinks]
ordered = 1.0
disordered = 0.0

[interval]
method = "block"
b = 400
resamples = 400
level = 0.95
seed = 62

[eps]
step = 0.01
sink = 0.02
y = 0.25
two_start = 0.01

[conjugate]
observable = "E"
conjugate_to = "beta (inverse temperature)"
hamiltonian_knowledge = true

[two_start]
observable = "Q"
definition = """E = sum of nn bond energies per snapshot (O column 0) / the declared bond \
count 2 L^2"""
unit_scale = { "27" = 1458, "81" = 13122, "243" = 118098 }

[kernel]
uses = ["A"]

[data]
format = "npz-v1"

[[data.files]]
point = "0.5"
size = 27
start = "random"
path = "x2/T0.50000-L27-random.npz"
arrays.G = { key = "G", level = 1 }
arrays.E = { key = "O", level = 0 }
arrays.Q = { key = "O", level = 0 }

