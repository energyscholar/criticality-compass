# THIS IS CC's m.toml (Kernel V8's M for ONE input: what was measured and how).
# It is NOT the toolset's m.toml (scratch/compass-toolset/m.toml, the study log).
# inputs/b7-at-line-2/m.toml - like b7-at-line, plus the along instrument over the declared point chain
# (frozen b7-at-line cannot gain an instrument, so this is a new input id on the same data)
schema = 1
kind = "input"
id = "b7-at-line-2"
instruments = ["across", "stability", "along"]

[obtained]
"0.0" = "truth"
"0.07" = "truth"
"0.14" = "truth"
"0.21" = "truth"
"0.2747" = "truth"

[axes]
point = ["0.0", "0.07", "0.14", "0.21", "0.2747"]
size = [27, 81, 243]
starts = ["random"]
main_start = "random"

[observable]
name = "g1 of p = sigma tau"
definition = "open-pair nearest-neighbour correlation of the block lattice (tools/flow.py g1)"
levels = [2, 3, 4]
final_size = 9

[block_map]
name = "majority3"
factor = 3
keeps = "the sign of the local majority; tie-free (odd block)"
discards = "the magnitude of the local magnetisation"

[relations.size]
template = "chain"
axis = "size"
provenance = "Coupling"
direction_from = "the declared blocking map: one more blocking step relates L to L/3"

[relations.control]
template = "chain"
axis = "point"
provenance = "Coupling"
direction_from = "the declared order of the exact self-dual-line points (L4 increasing)"

[interval]
method = "block"
b = 400
resamples = 400
level = 0.95
seed = 22

[eps]
y = 0.25

[conjugate]
observable = "E"
conjugate_to = "K (2-spin coupling)"
hamiltonian_knowledge = true

[kernel]
uses = ["A", "B"]

[data]
format = "npz-v1"

[[data.files]]
point = "0.0"
size = 27
start = "random"
path = "b7/L4-0.0000-L27.npz"
arrays.G = { key = "Gp", level = 1 }
arrays.E = { key = "E2" }

