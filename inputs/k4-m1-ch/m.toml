# THIS IS CC's m.toml (Kernel V8's M for ONE input: what was measured and how).
# It is NOT the toolset's m.toml (scratch/compass-toolset/m.toml, the study log).
# inputs/k4-m1/m.toml (plan 0880 P2) - 2D 8-state clock model, square lattice; T 0.30..1.10 step 0.05 (17 points), L 27/81/243, random start N 200000 and ordered start N 32000 at every T, skip 2, burn 1000, seeds 11000 + 10 (T index) + (L index) [+500 ordered]; sampler per transducer.toml; declarations like x2b-xy-3 minus transform; observable and block map as x3-clock6-3 with q = 8
schema = 1
kind = "input"
id = "k4-m1-ch"
instruments = [
  "needle", "across", "stability", "two_start", "fluct", "along", "needle_chain",
  "across_delta", "stability_delta",
]

[obtained]
"0.30" = "observed"
"0.35" = "observed"
"0.40" = "observed"
"0.45" = "observed"
"0.50" = "observed"
"0.55" = "observed"
"0.60" = "observed"
"0.65" = "observed"
"0.70" = "observed"
"0.75" = "observed"
"0.80" = "observed"
"0.85" = "observed"
"0.90" = "observed"
"0.95" = "observed"
"1.00" = "observed"
"1.05" = "observed"
"1.10" = "observed"

[axes]
point = [
  "0.30", "0.35", "0.40", "0.45", "0.50", "0.55", "0.60", "0.65", "0.70", "0.75", "0.80",
  "0.85", "0.90", "0.95", "1.00", "1.05", "1.10",
]
size = [27, 81, 243]
starts = ["random", "ordered"]
main_start = "random"

[observable]
name = "g1_xy of the plurality3 block states (unit vectors)"
definition = "open-pair nearest-neighbour correlation of the unit vectors (cos, sin of 2 pi k / 8) of the block states, every level down to final size 9"
levels = [2, 3, 4]
final_size = 9

[block_map]
name = "plurality3-stochastic"
factor = 3
keeps = "the most frequent clock state of each 3x3 block (ties broken uniformly)"
discards = "the within-block spread of states"

[sinks]
ordered = 1.0
disordered = 0.0

[interval]
method = "chains"
m = 10
r = 2
alpha = 0.021484375
chain_root = "root_0937C"

[eps]
step = 0.01
sink = 0.02
y = 0.25
two_start = 0.01
drift = 0.5

[conjugate]
observable = "E"
conjugate_to = "beta (inverse temperature)"
hamiltonian_knowledge = true

[two_start]
observable = "Q"
definition = """E = sum of nn bond energies per snapshot (O column 0) / the declared bond \
count 2 L^2"""
unit_scale = { "27" = 1458, "81" = 13122, "243" = 118098 }

[kernel]
uses = ["A", "B"]

[data]
format = "npz-v1"

