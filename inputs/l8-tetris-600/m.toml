# inputs/l8-tetris-600/m.toml (plan 0884 P2) - the 600 nm tetris artificial-spin-ice array (Dryad 10.5061/dryad.rbnzs7hcs, CC0): XMCD-PEEM island moments +-1 on the island grid,
# 64 frames per file, 6 s apart; the cool-down series 220 -> 180 K, one file per T by the declared rule (the first file per T in acquisition order whose logbook notes cell is empty);
# the second file per T and the flagged file 088 are EXCLUDED by declaration; one preparation; no energy column; one window side (flag W), no size relation; read by the relation-free
# `report` instrument (plan 0884 amendment 4); class UNVERIFIED - no case joined
schema = 1
kind = "input"
id = "l8-tetris-600"
instruments = ["report"]

[obtained]
"220" = "observed"
"218" = "observed"
"216" = "observed"
"214" = "observed"
"212" = "observed"
"210" = "observed"
"208" = "observed"
"206" = "observed"
"204" = "observed"
"202" = "observed"
"200" = "observed"
"198" = "observed"
"196" = "observed"
"194" = "observed"
"192" = "observed"
"190" = "observed"
"188" = "observed"
"186" = "observed"
"184" = "observed"
"182" = "observed"
"180" = "observed"

[axes]
point = ["220", "218", "216", "214", "212", "210", "208", "206", "204", "202", "200", "198", "196", "194", "192", "190", "188", "186", "184", "182", "180"]
size = [27]
starts = ["asgrown"]
main_start = "asgrown"

[observable]
name = "g1-occupied"
definition = "open-pair nearest-neighbour correlation of the block states over pairs whose both sites are occupied, every level down to final size 9"
levels = [2]
final_size = 9
level_floor = 0

[block_map]
name = "majority-occupied3"
factor = 3
keeps = "the sign of the local majority over occupied islands"
discards = "the magnitude; the vacancy pattern (the tetris motif leaves ~60-66 % of 3x3 cells with an EVEN island count, whose ties read block state 0 - a lattice artefact accepted by declaration); the frame order (Phase 1)"
limited = "none"

[windows]
side = 27
origin = "extent-min"
discards = "the islands outside the one 27x27 window at the file's (min row, min col)"

[sinks]
ordered = 1.0
disordered = 0.0

[interval]
method = "block"
tau_declared = 135
b = 405
resamples = 400
level = 0.95
seed = 7135498832818165358
min_blocks = 30

[eps]

[kernel]
uses = []

[data]
format = "island-table-v1"

