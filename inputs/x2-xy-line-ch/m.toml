point = "0.5"
size = 27
start = "random"
path = "cc-chains-0937/x2/p0_L27_s0_c0.npz"
chain = 0
arrays.G = { key = "G", level = 1 }
arrays.E = { key = "O", level = 0 }
arrays.Q = { key = "O", level = 0 }

