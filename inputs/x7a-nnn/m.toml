# THIS IS CC's m.toml (Kernel V8's M for ONE input: what was measured and how).
# It is NOT the toolset's m.toml (scratch/compass-toolset/m.toml, the study log).
# inputs/x7a-nnn/m.toml - the nn+nnn Ising manifold: exact K_c Ising (toolset data/p3) and the navigated K2 = 0.1
# point (data/b3). Seed 77 starts a fresh stream: X7a ran this set second on bc's stream, so its cells are a SET
schema = 1
kind = "input"
id = "x7a-nnn"
instruments = ["needle", "along"]

[obtained]
"k2-0.0" = "truth"
"k2-0.1" = "navigated"

[axes]
point = ["k2-0.0", "k2-0.1"]
size = [27, 81, 243]
starts = ["random"]
main_start = "random"

[observable]
name = "g1"
definition = """open-pair nearest-neighbour correlation of the block lattice (two samplers, \
one observable)"""
levels = [2, 3, 4]
final_size = 9

[block_map]
name = "majority3"
factor = 3
keeps = "the sign of the local majority; tie-free (odd block)"
discards = "the magnitude of the local magnetisation"

[interval]
method = "block"
b = 400
resamples = 400
level = 0.95
seed = 77

[eps]
step = 0.01
sink = 0.02
y = 0.25

[kernel]
uses = ["A", "B"]

[data]
format = "npz-v1"

[[data.files]]
point = "k2-0.0"
size = 27
start = "random"
path = "p3/L27-N8000-s200.npz"
arrays.G = { key = "G", level = 1 }

[[data.files]]
point = "k2-0.0"
size = 81
start = "random"
path = "p3/L81-N8000-s200.npz"
arrays.G = { key = "G", level = 2 }
arrays.GL = { key = "G" }

[[data.files]]
point = "k2-0.0"
size = 243
start = "random"
path = "p3/L243-N8000-s200.npz"
arrays.G = { key = "G", level = 3 }
arrays.GL = { key = "G" }

[[data.files]]
point = "k2-0.1"
size = 27
start = "random"
path = "b3/L27.npz"
arrays.G = { key = "G", level = 1 }

[[data.files]]
point = "k2-0.1"
size = 81
start = "random"
path = "b3/L81.npz"
arrays.G = { key = "G", level = 2 }
arrays.GL = { key = "G" }

[[data.files]]
point = "k2-0.1"
size = 243
start = "random"
path = "b3/L243.npz"
arrays.G = { key = "G", level = 3 }
arrays.GL = { key = "G" }

[relations.size]
template = "chain"
axis = "size"
provenance = "Coupling"
direction_from = "the declared blocking map at equal final size"

[relations.control]
template = "chain"
axis = "point"
provenance = "Coupling"
direction_from = "the declared order of the manifold points (K2 = 0 exact K_c, then K2 = 0.1)"

[relations.matched]
template = "matched"
axis = "size"
big = 243
small = 81
provenance = "Coupling"
direction_from = """one extra declared blocking step at equal block-lattice size (toolset m.toml \
[X7] membership)"""

[sinks]
ordered = 1.0
disordered = 0.0
