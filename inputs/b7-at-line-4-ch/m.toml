# THIS IS CC's m.toml (Kernel V8's M for ONE input: what was measured and how).
# It is NOT the toolset's m.toml (scratch/compass-toolset/m.toml, the study log).
# inputs/b7-at-line-4/m.toml - like b7-at-line-3, plus the needle on Gp (plan 0868 step 2): GL = the frozen level stack of g1 of p = sigma tau, single (random) start,
# so needle_pair and two_start are not measured (B7 ran no ordered start).
schema = 1
kind = "input"
id = "b7-at-line-4-ch"
instruments = ["across", "stability", "along", "fluct", "needle"]

[obtained]
"0.0" = "truth"
"0.07" = "truth"
"0.14" = "truth"
"0.21" = "truth"
"0.2747" = "truth"

[axes]
point = ["0.0", "0.07", "0.14", "0.21", "0.2747"]
size = [27, 81, 243]
starts = ["random"]
main_start = "random"

[observable]
name = "g1 of p = sigma tau"
definition = "open-pair nearest-neighbour correlation of the block lattice (tools/flow.py g1)"
levels = [2, 3, 4]
final_size = 9

[block_map]
name = "majority3"
factor = 3
keeps = "the sign of the local majority; tie-free (odd block)"
discards = "the magnitude of the local magnetisation"

[relations.size]
template = "chain"
axis = "size"
provenance = "Coupling"
direction_from = "the declared blocking map: one more blocking step relates L to L/3"

[relations.control]
template = "chain"
axis = "point"
provenance = "Coupling"
direction_from = "the declared order of the exact self-dual-line points (L4 increasing)"

[relations.matched]
template = "matched"
axis = "size"
big = 243
small = 81
provenance = "Coupling"
direction_from = "one extra declared blocking step at equal block-lattice size ([P2] relations)"

[interval]
method = "chains"
m = 10
r = 2
alpha = 0.021484375
chain_root = "root_0937C"

[eps]
y = 0.25
step = 0.01
sink = 0.02

[conjugate]
observable = "E"
conjugate_to = "K (2-spin coupling)"
hamiltonian_knowledge = true

[kernel]
uses = ["A", "B"]

[data]
format = "npz-v1"

