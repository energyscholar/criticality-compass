# THIS IS CC's m.toml (Kernel V8's M for ONE input: what was measured and how).
# It is NOT the toolset's m.toml (scratch/compass-toolset/m.toml, the study log).
# inputs/x4-ising-field/m.toml - 2D Ising below T_c at h = 0, K 0.46-0.55, L = 27-243; PLUS plays the random start, MINUS the second start (toolset [X4])
# K is a declared control (truth point); K_c = 0.4407, all three are below T_c
schema = 1
kind = "input"
id = "x4-ising-field-ch"
instruments = ["needle", "across", "stability", "two_start"]

[obtained]                     # point label -> truth | navigated | observed
"0.46" = "truth"
"0.5" = "truth"
"0.55" = "truth"

[axes]
point = ["0.46", "0.5", "0.55"]
size = [27, 81, 243]
starts = ["random", "ordered"]
main_start = "random"

[observable]
name = "g1 of the majority block lattice"
definition = "open-pair nearest-neighbour correlation of each block lattice (toolset tools/flow.py), every level down to final size 9; the file names are plus (role: random) and minus (role: ordered)"
levels = [2, 3, 4]                             # stored levels per size, in axes.size order
final_size = 9

[block_map]
name = "majority3"
factor = 3
keeps = "the sign of the local majority; tie-free"
discards = "the magnitude of the local magnetisation"

[relations.size]
template = "chain"
axis = "size"
direction_from = "the declared blocking map: one more blocking step relates L to L/3"

[relations.matched]
template = "matched"
axis = "size"
big = 243
small = 81
direction_from = "one extra declared blocking step at equal block-lattice size ([P2] relations)"

[relations.start]
template = "pair"
axis = "starts"
pairs = [["random", "ordered"]]
direction_from = "two runs at the same point differing only in the declared initial state"

[sinks]
ordered = 1.0
disordered = 0.0

[interval]
method = "chains"
m = 10
r = 2
alpha = 0.021484375
chain_root = "root_0937C"

[eps]
step = 0.01
sink = 0.02
y = 0.25
two_start = 0.01

[conjugate]
observable = "E"
conjugate_to = "beta (inverse temperature; E is h-even)"
hamiltonian_knowledge = true

[two_start]
observable = "Q"
definition = "E = sum of nn bond energies per snapshot (O column 0) / the declared bond count 2 L^2"
unit_scale = { "27" = 1458, "81" = 13122, "243" = 118098 }

[kernel]
uses = ["A"]

[data]
format = "npz-v1"

