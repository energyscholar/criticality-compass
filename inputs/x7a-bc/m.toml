# THIS IS CC's m.toml (Kernel V8's M for ONE input: what was measured and how).
# It is NOT the toolset's m.toml (scratch/compass-toolset/m.toml, the study log).
# inputs/x7a-bc/m.toml - Blume-Capel lambda-line points (toolset C1b / C1b2 frozen data): the X7a along test
# with membership read from the needle (point-major file order, seed 77: X7a's own BC index stream)
schema = 1
kind = "input"
id = "x7a-bc"
instruments = ["needle", "along"]

[obtained]
"0.0" = "navigated"
"1.0" = "navigated"
"1.5" = "navigated"
"1.8" = "navigated"
"1.9" = "navigated"
"1.95" = "navigated"

[axes]
point = ["0.0", "1.0", "1.5", "1.8", "1.9", "1.95"]
size = [27, 81, 243]
starts = ["random"]
main_start = "random"

[observable]
name = "g1"
definition = """open-pair nearest-neighbour correlation of the block lattice; block value 0 \
for a zero block sum (declared, toolset m.toml [C1a])"""
levels = [2, 3, 4]
final_size = 9

[block_map]
name = "sign3-vacant"
factor = 3
keeps = """the sign of the 3x3 block sum in {-1, 0, +1}; a zero sum is the vacant value \
0 (a Blume-Capel value)"""
discards = "the magnitude of the block sum"

[interval]
method = "block"
b = 400
resamples = 400
level = 0.95
seed = 77

[eps]
step = 0.01
sink = 0.02
y = 0.25

[kernel]
uses = ["A", "B"]

[data]
format = "npz-v1"

[[data.files]]
point = "0.0"
size = 27
start = "random"
path = "c1/d0.0-L27.npz"
arrays.G = { key = "G", level = 1 }

[[data.files]]
point = "0.0"
size = 81
start = "random"
path = "c1/d0.0-L81.npz"
arrays.G = { key = "G", level = 2 }
arrays.GL = { key = "G" }

[[data.files]]
point = "0.0"
size = 243
start = "random"
path = "c1/d0.0-L243.npz"
arrays.G = { key = "G", level = 3 }
arrays.GL = { key = "G" }

