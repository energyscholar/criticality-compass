[relations.size]
template = "chain"
axis = "size"
provenance = "Coupling"
direction_from = "the declared blocking map at equal final size"

[relations.control]
template = "chain"
axis = "point"
provenance = "Coupling"
direction_from = "the declared order of points along the lambda line (delta increasing)"

[relations.matched]
template = "matched"
axis = "size"
big = 243
small = 81
provenance = "Coupling"
direction_from = """one extra declared blocking step at equal block-lattice size (toolset m.toml \
[X7] membership)"""

[sinks]
ordered = 1.0
disordered = 0.0
