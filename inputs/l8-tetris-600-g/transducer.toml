# inputs/l8-tetris-600/transducer.toml (plan 0884 P2) - the record file: how the L8 data entered M, what the per-locus reading keeps and discards, the interval's role.
schema = 1
kind = "record"
id = "l8-tetris-600-g"

[record]
apparatus = "XMCD-PEEM, ALS beamline 11 (file prefix bl11), 18 kV, 20 x 20 um field of view, exposure 0.5 s, gap 5.5 s (one frame per 6 s)"
preparation = "one: the as-grown thermally active 600 nm tetris array (sample tetris 600B, wafer 20160408E), read while cooling 220 -> 180 K in 2 K steps, ~13 min per T"
observation = "one frame = the +-1 moment of every resolved island at one T; 64 frames per file; one file per T selected by the declared rule (first file per T in acquisition order whose logbook notes cell is empty)"
authors_projection = "the authors' clustering of the XMCD contrast to +-1 per island per frame (Spin_files/*_tetrisspin_clustering_total.csv) - THEIRS; CC never re-thresholds"
source = "Dryad 10.5061/dryad.rbnzs7hcs (CC0); logbook ALS_April16/Analyzed_data/ALS_April_2016_data_info.xlsx sha256 df652ad200cb77708f3167c07bc44d20372d36dc08c3a97dd52104e95d600b7c"

[reduction]
name = "per-locus mean of the occupied-pair g1 of the declared block states over the frames of one window side at one T"
keeps = "the typical value of the observable at the locus (one T, one window side)"
discards = "the frame-to-frame variation and the frame order (Phase 1: a stationary record at fixed T)"

[interval]
role = "projection C: places the reading's sign cell against its declared margin; never an operator input"
keeps = "the position of the interval ends among the cuts -eps, 0, +eps"
discards = "the shape of the resampled distribution"

[provenance_note]
declared_after = []
note = "the gamma twin of l8-tetris-600; excluded by declaration, never read: the second file of every T (052, 054, ..., 092) and file 088 (logbook note: Beam Drifted in middle of run); the per-file island index sets differ (28 distinct occupancy sets over the 84 files), so the window origin is the extent-min rule, not a number. Provenance class per column (relay 7.3; evidence rule of ADAPT-PROVENANCE-v1: Shown only when a deposited document STATES it): T (K) per file = ACQUISITION_DEFINED (apparatus thermometer; used only as the control order; Shown: logbook sha256 df652ad2...600b7c column T (K); thermometer calibration Unshown); comment (column N) per file = ACQUISITION_DEFINED metadata, selection only, never an observable; frame index f1..f64 (acquisition order, 6 s) = ACQUISITION_DEFINED, Phase 1 discards the order; row, col (island grid index) and the occupancy mask they imply = UNDETERMINED (Unshown: no deposited document states the authors' indexing convention; Codes/ is not in the deposit); island moment +-1 (the 64 frame columns) = UNDETERMINED (Bruce ruling D1, 2026-10-11: the authors' clustering script /Codes/intensity_to_spin.ipynb is not deposited, so how the cut was set is Unshown); window crop 27 x 27 extent-min, majority-occupied3 block map and g1 over occupied pairs are not columns but M-declared projections and reductions (amendment 1; Robin Q12). Single declarer (Bruce D2, 2026-10-11): no second human has read this declaration yet."
