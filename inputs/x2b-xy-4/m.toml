[relations.size]
template = "chain"
axis = "size"
provenance = "Coupling"
direction_from = "the declared blocking map: one more blocking step relates L to L/3"

[relations.matched]
template = "matched"
axis = "size"
big = 243
small = 81
provenance = "Coupling"
direction_from = "one extra declared blocking step at equal block-lattice size ([P2] relations)"

[relations.start]
template = "pair"
axis = "starts"
pairs = [["random", "ordered"]]
provenance = "Coupling"
direction_from = "two runs at the same point differing only in the declared initial state"

[relations.control]
coupling = "T"
template = "chain"
axis = "point"
provenance = "Coupling"
direction_from = """the declared order of the points: T increasing, 0.5 -> 1.1 (the one control, \
the temperature, moves ALONG the line)"""

[relations.chain]
template = "matched-chain"
axis = "size"
pairs = [[243, 81], [81, 27]]
provenance = "Coupling"
direction_from = """one extra declared blocking step at equal block-lattice size, taken at both \
neighbouring size pairs; the second pair's velocity is the first pair's \
predecessor in the size chain"""
