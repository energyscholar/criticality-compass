# THIS IS CC's m.toml (Kernel V8's M for ONE input: what was measured and how).
# It is NOT the toolset's m.toml (scratch/compass-toolset/m.toml, the study log).
# inputs/x2b-xy-4/m.toml (plan 0878 P3) - x2b-xy-3 (the FROZEN X2b data, unchanged) read through the Γ-method interval (a declared projection C); transform absent
schema = 1
kind = "input"
id = "x2b-xy-4"
instruments = [
  "needle", "across", "stability", "two_start", "fluct", "along", "needle_chain",
  "across_delta", "stability_delta",
]

[obtained]
"0.5" = "truth"
"0.6" = "truth"
"0.7" = "truth"
"0.8" = "truth"
"0.85" = "truth"
"0.89294" = "truth"
"0.95" = "truth"
"1.0" = "truth"
"1.1" = "truth"

[axes]
point = ["0.5", "0.6", "0.7", "0.8", "0.85", "0.89294", "0.95", "1.0", "1.1"]
size = [27, 81, 243]
starts = ["random", "ordered"]
main_start = "random"

[observable]
name = "g1_xy of the sum-and-normalise block lattice"
definition = """open-pair nearest-neighbour correlation s_i . s_j of the block unit vectors, \
every level down to final size 9 (matched across sizes)"""
levels = [2, 3, 4]
final_size = 9

[block_map]
name = "sum-and-normalise3"
factor = 3
keeps = "the direction of each 3x3 block's net moment (a unit vector)"
discards = "the magnitude of the block's moment and the arrangement inside the block"

[sinks]
ordered = 1.0
disordered = 0.0

[interval]
method = "gamma"
level = 0.95
window_s = 1.5
window_max = 400
door_z = 3.0
tau_declared = 36    # samples (plan 0891). The floor n >= k_gamma * tau_declared reads THIS, never Gamma's own estimate
tau_source = "this input's own stored result results/x2b-xy-4@v08-rules.json: the largest Wolff window W over its 110 W:* reports is 36 samples (an upper bound on the correlation time there; the 0889 cell's tau_int is 2.04); n = 600000 per file"

[eps]
step = 0.01
sink = 0.02
y = 0.25
two_start = 0.01
drift = 0.5

[conjugate]
observable = "E"
conjugate_to = "beta (inverse temperature)"
hamiltonian_knowledge = true

[two_start]
observable = "Q"
definition = """E = sum of nn bond energies per snapshot (O column 0) / the declared bond \
count 2 L^2"""
unit_scale = { "27" = 1458, "81" = 13122, "243" = 118098 }

[kernel]
uses = ["A", "B"]

[data]
format = "npz-v1"

[[data.files]]
point = "0.5"
size = 27
start = "random"
path = "x2b/T0.50000-L27-random.npz"
arrays.G = { key = "G", level = 1 }
arrays.E = { key = "O", level = 0 }
arrays.Q = { key = "O", level = 0 }
arrays.GL = { key = "G" }

