# inputs/x8-ising-needle/transducer.toml - the transducer file (plan 0883, Q0): the sampler, what the per-locus mean keeps and discards, the interval's role.
schema = 1
kind = "transducer"
id = "x8-ising-needle"

[transducer]
model = "2D Ising, Swendsen–Wang, K/K_c 0.90–1.10"
update = ["tools/lattice.py sha256 80a40933370f7f91711076c11fea4dc3e802b2ce478d0fd7fb0c678931d75a42"]
inputs = "m.toml [P1] (data/p1) + [P2] (data/p2) · studies/P1/simulate.py + studies/P2/simulate.py"
output = "one configuration per recorded sweep; each configuration is one observation; the recorded sequence is NOT a process sequence (Phase 1 only)"

[reduction]
name = "per-locus mean of the declared observable over the declared configurations"
keeps = "the typical value of the observable at the locus (one point, one size, one start)"
discards = "the configuration-to-configuration variation and the order of the configurations"

[interval]
role = "projection C: places the reading's sign cell against its declared margin; never an operator input"
keeps = "the position of the interval ends among the cuts -eps, 0, +eps"
discards = "the shape of the resampled distribution"

[provenance_note]
declared_after = ["x8-ising-needle@v01-rules", "x8-ising-needle@v02-rules", "x8-ising-needle@v03-rules", "x8-ising-needle@v04-rules", "x8-ising-needle@v05-rules", "x8-ising-needle@v06-rules", "x8-ising-needle@v07-rules", "x8-ising-needle@verdict-x-rules"]
note = "the stored arrays are the STUDY's g1 per recorded sweep (format npy): the per-locus mean is over those values"
