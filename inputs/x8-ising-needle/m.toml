# THIS IS CC's m.toml (Kernel V8's M for ONE input: what was measured and how).
# It is NOT the toolset's m.toml (scratch/compass-toolset/m.toml, the study log).
# inputs/x8-ising-needle/m.toml - 2D Ising K/K_c 0.90-1.10, L = 243 (data/p1) and 81
# (data/p2): the X8 sink-aware needle
schema = 1
kind = "input"
id = "x8-ising-needle"
instruments = ["needle"]

[obtained]                     # point label -> truth | navigated | observed
"0.90" = "truth"
"0.95" = "truth"
"0.98" = "truth"
"0.99" = "truth"
"1.00" = "truth"
"1.01" = "truth"
"1.02" = "truth"
"1.05" = "truth"
"1.10" = "truth"

[axes]
point = [
  "0.90", "0.95", "0.98", "0.99", "1.00",
  "1.01", "1.02", "1.05", "1.10",
]      # K/K_c; increasing K = colder
size = [81, 243]
starts = ["random"]
main_start = "random"

[observable]
name = "g1"
definition = "open-pair nearest-neighbour correlation of each block lattice (toolset tools/flow.py)"
levels = [3, 4]                                # 81 -> 27 -> 9; 243 -> 81 -> 27 -> 9
final_size = 9

[block_map]
name = "majority3"
factor = 3
keeps = "the sign of the local majority; tie-free"
discards = "the magnitude of the local magnetisation"

[relations.matched]
template = "matched"
axis = "size"
big = 243
small = 81
provenance = "Coupling"                        # kernel EDGE provenance (Coupling | Continuation)
direction_from = "one extra declared blocking step at equal block-lattice size ([P2] relations)"

[sinks]
ordered = 1.0                                  # g1 at the ordered fixed point (T = 0)
disordered = 0.0                               # g1 at the disordered fixed point (T = inf)

[interval]
method = "iid"                                 # P2's declaration: SW snapshots, skip 2
tau_declared = 1
resamples = 400
level = 0.95
seed = 8

[eps]
step = 0.01
sink = 0.02

[kernel]
uses = ["A"]

[data]
format = "npy-v1"                              # one array per file; the only key is "npy"

[[data.files]]
point = "0.90"
size = 243
start = "random"
path = "p1/g1-0.90.npy"
arrays.GL = { key = "npy" }

[[data.files]]
point = "0.90"
size = 81
start = "random"
path = "p2/g1-0.90.npy"
arrays.GL = { key = "npy" }

