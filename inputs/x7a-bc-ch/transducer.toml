# inputs/x7a-bc-ch/transducer.toml - the transducer file (plan 0883, Q0): the sampler, what the per-locus mean keeps and discards, the interval's role.
schema = 1
kind = "transducer"
id = "x7a-bc-ch"

[transducer]
model = "2D Blume–Capel lambda-line points; vacant-0 block value ([C1a])"
update = ["tools/lattice_bc2.py sha256 f24c0e45d4217923f966ee71082a79e9b1c245e42c5703265e6572284ccf6ecf", "tools/lattice_at2.py sha256 640e32fdd1e56f1a939338885cc0f007dbd9709fc806ae34e0b5b592d320765d", "tools/scale.py sha256 1dff330d804d067e26f8c6c7dbe86739f0ee75635e5d1661f163d01bcf908f2b", "tools/flow.py sha256 5f5b225a2cbc49bf2eef8c2168a2059620476c304fe71524eb687b12e1b9cae7"]
inputs = "chains: tools/0937_gen.py (sha256 e63e012793cea5351bc8c217fb9b1a5f213d34178a82136804ce2db4b5b269e2) and data/cc-chains-0937/MANIFEST.tsv (sha256 b74a41516567da7a5df839db0dce3d4149cb8e51cfd9ab404b2f68ad77446d5b); m.toml [0937.chains] (root_0937C, spawn keys); points, sizes, starts, N, burn, skip = the parent's: m.toml [C1b] + [C1b2] · studies/C1/simulate_b.py + simulate_b2.py"
output = "one configuration per recorded sweep; each configuration is one observation; the recorded sequence is NOT a process sequence (Phase 1 only)"

[reduction]
name = "per-locus mean of the declared observable over the declared configurations"
keeps = "the typical value of the observable at the locus (one point, one size, one start)"
discards = "the configuration-to-configuration variation and the order of the configurations"

[interval]
role = "projection C: places the reading's sign cell against its declared margin; never an operator input"
keeps = "the position of the interval ends among the cuts -eps, 0, +eps"
discards = "the shape of the resampled distribution"

[provenance_note]
declared_after = []
note = "the 180 chain files of this input were produced by: tools/lattice_bc2.py (exact; byte-identical to lattice_bc.py) (the sampler string recorded in each chain's .rec.json header and in the chain manifest row); the parent's transducer pinned tools/lattice_bc.py (replaced here by the producers listed in update); data is not in git, pinned by fixtures/data/x7a-bc-ch.toml; plan 0937 amendment 9 | parent note: two drivers, one sampler"
