# inputs/c2-bc-two-start-ch/transducer.toml - the transducer file (plan 0883, Q0): the sampler, what the per-locus mean keeps and discards, the interval's role.
schema = 1
kind = "transducer"
id = "c2-bc-two-start-ch"

[transducer]
model = "2D Blume–Capel, L 81, path D = delta K"
update = ["tools/lattice_bc2.py sha256 f24c0e45d4217923f966ee71082a79e9b1c245e42c5703265e6572284ccf6ecf", "tools/lattice_at2.py sha256 640e32fdd1e56f1a939338885cc0f007dbd9709fc806ae34e0b5b592d320765d"]
inputs = "chains: tools/0937_gen.py (sha256 e63e012793cea5351bc8c217fb9b1a5f213d34178a82136804ce2db4b5b269e2) and data/cc-chains-0937/MANIFEST.tsv (sha256 b74a41516567da7a5df839db0dce3d4149cb8e51cfd9ab404b2f68ad77446d5b); m.toml [0937.chains] (root_0937C, spawn keys); points, sizes, starts, N, burn, skip = the parent's: m.toml [C2] · studies/C2/run.py (the run script samples and writes data/c2)"
output = "one configuration per recorded sweep; each configuration is one observation; the recorded sequence is NOT a process sequence (Phase 1 only)"

[reduction]
name = "per-locus mean of the declared observable over the declared configurations"
keeps = "the typical value of the observable at the locus (one point, one size, one start)"
discards = "the configuration-to-configuration variation and the order of the configurations"

[interval]
role = "projection C: places the reading's sign cell against its declared margin; never an operator input"
keeps = "the position of the interval ends among the cuts -eps, 0, +eps"
discards = "the shape of the resampled distribution"

[provenance_note]
declared_after = []
note = "the 540 chain files of this input were produced by: tools/lattice_bc2.py (exact; byte-identical to lattice_bc.py) (the sampler string recorded in each chain's .rec.json header and in the chain manifest row); the parent's transducer pinned tools/lattice_bc.py (replaced here by the producers listed in update); data is not in git, pinned by fixtures/data/c2-bc-two-start-ch.toml; plan 0937 amendment 9 | parent note: driver is a run script, not a simulate.py"
