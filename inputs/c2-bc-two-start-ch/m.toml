# THIS IS CC's m.toml (Kernel V8's M for ONE input: what was measured and how).
# It is NOT the toolset's m.toml (scratch/compass-toolset/m.toml, the study log).
# inputs/c2-bc-two-start/m.toml - Blume-Capel two-start screen, L = 81 (toolset [C2]);
# one point per (delta, K): v0 has one point axis, so delta is folded into the label
schema = 1
kind = "input"
id = "c2-bc-two-start-ch"
instruments = ["two_start"]

[obtained]                     # point label -> truth | navigated | observed
"d2.0-K1.0" = "observed"
"d2.0-K1.2" = "observed"
"d2.0-K1.4" = "observed"
"d2.0-K1.6" = "observed"
"d2.0-K1.8" = "observed"
"d2.0-K2.0" = "observed"
"d2.0-K2.3" = "observed"
"d2.0-K2.6" = "observed"
"d2.0-K3.0" = "observed"
"d1.95-K1.0" = "observed"
"d1.95-K1.2" = "observed"
"d1.95-K1.4" = "observed"
"d1.95-K1.6" = "observed"
"d1.95-K1.8" = "observed"
"d1.95-K2.0" = "observed"
"d1.95-K2.3" = "observed"
"d1.95-K2.6" = "observed"
"d1.95-K3.0" = "observed"
"d1.9-K1.0" = "observed"
"d1.9-K1.2" = "observed"
"d1.9-K1.4" = "observed"
"d1.9-K1.6" = "observed"
"d1.9-K1.8" = "observed"
"d1.9-K2.0" = "observed"
"d1.9-K2.3" = "observed"
"d1.9-K2.6" = "observed"
"d1.9-K3.0" = "observed"

[axes]
point = [
  "d2.0-K1.0", "d2.0-K1.2", "d2.0-K1.4", "d2.0-K1.6",
  "d2.0-K1.8", "d2.0-K2.0", "d2.0-K2.3", "d2.0-K2.6",
  "d2.0-K3.0", "d1.95-K1.0", "d1.95-K1.2", "d1.95-K1.4",
  "d1.95-K1.6", "d1.95-K1.8", "d1.95-K2.0", "d1.95-K2.3",
  "d1.95-K2.6", "d1.95-K3.0", "d1.9-K1.0", "d1.9-K1.2",
  "d1.9-K1.4", "d1.9-K1.6", "d1.9-K1.8", "d1.9-K2.0",
  "d1.9-K2.3", "d1.9-K2.6", "d1.9-K3.0",
]
size = [81]                                    # length 1: two_start is per (point, size)
starts = ["vacant", "ordered"]
main_start = "ordered"                         # required; no single-start instrument here

[relations.start]
template = "pair"
axis = "starts"
pairs = [["vacant", "ordered"]]                # 'vacant -> ordered': A = q(ordered) - q(vacant)
provenance = "Coupling"
direction_from = "two runs at the same (delta, K) differing only in the declared initial state"

[interval]
method = "chains"
m = 10
r = 2
alpha = 0.021484375
chain_root = "root_0937C"

[eps]
two_start = 0.02

[two_start]
observable = "Q"
definition = "q = mean s^2 per site (vacancy complement) per snapshot; already per site"
unit_scale = { "81" = 1 }

[kernel]
uses = ["A"]

[data]
format = "npz-v1"                              # one file per (delta, K) holds both starts

