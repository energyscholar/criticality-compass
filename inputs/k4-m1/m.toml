point = "0.30"
size = 27
start = "random"
path = "k4m1/T0.30-L27-random.npz"
arrays.G = { key = "G", level = 1 }
arrays.E = { key = "O", level = 0 }
arrays.Q = { key = "O", level = 0 }
arrays.GL = { key = "G" }

