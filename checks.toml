# checks.toml - criticality-compass. Every listed file exists; a file is added in the phase
# (and the edit) that creates it.
[roles]
maths = [
  "cc/kernel.py", "cc/sign.py", "cc/resample.py", "cc/project.py", "cc/readout.py",
  "cc/instruments/needle.py", "cc/instruments/across.py", "cc/instruments/stability.py",
  "cc/instruments/two_start.py", "cc/instruments/along.py", "cc/instruments/fluct.py", "cc/instruments/needle_chain.py", "cc/instruments/across_delta.py", "cc/instruments/stability_delta.py", "cc/instruments/transform.py", "cc/fingerprint.py", "cc/reduce.py", "cc/gamma.py",
]
plumbing = ["bin/cc", "cc/admit.py", "cc/schema.py", "cc/declare.py", "cc/author.py", "cc/door.py", "cc/formats.py", "cc/detect.py", "cc/resources.py", "cc/view.py", "cc/score.py", "cc/reverdict.py", "cc/family.py", "cc/transducer.py", "tests/reference/verdict_x.py", "tests/trace/sitecustomize.py",
  ".githooks/pre-commit"]
benchmark = []
methods = ["cc/detect.py"]
tests = [
  "tests/test_closure.py",
  "tests/test_budget.py",
  "tests/test_kernel.py", "tests/test_sign.py", "tests/test_resample.py", "tests/test_kernel_rs.py",
  "tests/test_declare.py", "tests/test_transducer.py", "tests/test_tables_cli.py",
  "tests/test_needle_x8.py", "tests/test_b7.py", "tests/test_w2.py", "tests/test_two_start_c2.py",
  "tests/test_detect_verdicts.py", "tests/test_breakers.py", "tests/test_breakers_red.py",
  "tests/test_golden.py", "tests/test_verdict_equivalence.py",
  "tests/test_scoreboard.py", "tests/test_view.py", "tests/test_tabulate.py", "tests/test_reverdict.py",
  "tests/test_along.py", "tests/test_family.py", "tests/test_x5.py", "tests/test_axes.py", "tests/test_needle_o_start.py",
  "tests/test_run_all.py", "tests/test_pool.py", "tests/test_schedule.py", "tests/test_freeze_key.py", "tests/test_code_hash.py",
  "tests/test_across_delta.py", "tests/test_stability_delta.py", "tests/test_v08_tables.py", "tests/test_v08_result.py", "tests/test_delta_basis.py", "tests/test_transformed.py", "tests/test_end_note.py", "tests/test_v06_locks.py", "tests/test_classify.py", "tests/test_probe.py", "tests/test_chain.py", "tests/test_ends.py", "tests/test_reduce.py", "tests/test_stack_door.py", "tests/test_reuse.py", "tests/test_gamma.py", "tests/test_gamma_plan.py", "tests/test_gamma_twin.py",
  "tests/test_explain_pair.py", "tests/test_check_summary.py",
]

[allow]
modules = ["numpy", "dataclasses", "enum", "kernel", "sign", "resample", "project", "readout", "fingerprint", "gamma"]
numpy = [
  "array", "bincount", "zeros", "abs", "maximum", "maximum.at", "searchsorted", "asarray",
  "atleast_1d", "arange", "log", "exp", "mean", "stack", "hstack", "quantile", "reshape", "sign",
  "empty", "ceil", "log2", "sqrt", "fft.rfft", "fft.irfft", "conj",
]

# [tables] is deliberately absent: CC's tables are TOML data whose totality and partition are
# checked by `bin/cc validate` (cc/declare.py), not by checks.py C6.

[closure.measure]               # plan 0886: the measurement closure, declared. Membership is COMPUTED (schema.import_closure); only these two lists are data.
entries = ["cc/detect.py", "cc/door.py"]        # + each input's instrument modules (seeded at measure time: schema.MEASURE_SEEDED)
outside = ["cc/declare.py", "cc/author.py", "cc/view.py", "cc/score.py", "cc/family.py", "cc/transducer.py", "cc/fingerprint.py", "bin/cc"]
