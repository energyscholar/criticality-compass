[allow]
modules = ["numpy", "dataclasses", "enum", "kernel", "sign", "resample", "project", "readout", "fingerprint", "gamma"]
numpy = [
  "array", "bincount", "zeros", "abs", "maximum", "maximum.at", "searchsorted", "asarray",
  "atleast_1d", "arange", "log", "exp", "mean", "stack", "hstack", "quantile", "reshape", "sign",
  "empty", "ceil", "log2", "sqrt", "fft.rfft", "fft.irfft", "conj", "sort", "median",   # plan 0937: the order statistics of the m chain readings and their median
]

# [tables] is deliberately absent: CC's tables are TOML data whose totality and partition are
# checked by `bin/cc validate` (cc/declare.py), not by checks.py C6.

[closure.measure]               # plan 0886: the measurement closure, declared. Membership is COMPUTED (schema.import_closure); only these two lists are data.
entries = ["cc/detect.py", "cc/door.py"]        # + each input's instrument modules (seeded at measure time: schema.MEASURE_SEEDED)
outside = ["cc/declare.py", "cc/author.py", "cc/view.py", "cc/score.py", "cc/family.py", "cc/transducer.py", "cc/fingerprint.py", "bin/cc", "cc/intake.py", "cc/intake_blind.py", "cc/intake_seal.py", "cc/intake_data.py", "cc/intake_read.py", "cc/intake_synth.py"]
