  "tests/test_across_delta.py", "tests/test_stability_delta.py", "tests/test_v08_tables.py", "tests/test_v08_result.py", "tests/test_delta_basis.py", "tests/test_transformed.py", "tests/test_end_note.py", "tests/test_v06_locks.py", "tests/test_classify.py", "tests/test_probe.py", "tests/test_chain.py", "tests/test_ends.py", "tests/test_reduce.py", "tests/test_stack_door.py", "tests/test_reuse.py", "tests/test_gamma.py", "tests/test_gamma_plan.py", "tests/test_gamma_twin.py",
  "tests/test_explain_pair.py", "tests/test_check_summary.py", "tests/test_conventional.py",
  "tests/test_structure_gate.py", "tests/test_no_host_paths.py", "tests/test_wheel.py", "tests/test_install_refuses.py", "tests/test_data_root.py", "tests/test_kernel_rs_bitwise.py", "tests/test_launcher.py", "tests/test_kernel_identity_key.py", "tests/test_pin_history.py", "tests/test_chains.py", "tests/test_chains_declare.py", "tests/test_v10_readable.py", "tests/test_island_table.py", "tests/test_occupied.py", "tests/test_report.py", "tests/test_expect.py", "tests/test_registry.py", "tests/test_intake.py", "tests/test_intake_example.py", "tests/test_intake_cli.py", "tests/test_intake_read.py", "tests/test_intake_long.py", "tests/test_intake_reach.py", "tests/test_intake_leak.py", "tests/test_intake_convert.py", "tests/test_intake_terminal.py", "tests/test_intake_residue.py", "tests/test_intake_loop2.py", "tests/test_intake_loop4.py", "tests/test_intake_profile.py", "tests/test_feature.py", "tests/test_suspect.py", "tests/test_navigate.py",   # plan 1114: the stored-map navigator; plan 1176 A: the suspect in cells; plan 1176 B: the feature oracle; plan 1165: the profile; plan 1160 loop 2 and 3 (A17-A32); plan 1160 P6: the terminal; plan 1160 P3: the conversion; plan 1160 P0: the leak test; plan 1139: the intake from the command line; plan 1136: the intake; plan 0929 (+ plan 0884 P2: island table, windows, occupied maths)
]

[allow]
modules = ["numpy", "dataclasses", "enum", "kernel", "sign", "resample", "project", "readout", "fingerprint", "gamma"]
numpy = [
  "array", "bincount", "zeros", "abs", "maximum", "maximum.at", "searchsorted", "asarray",
  "atleast_1d", "arange", "log", "exp", "mean", "stack", "hstack", "quantile", "reshape", "sign",
  "empty", "ceil", "log2", "sqrt", "fft.rfft", "fft.irfft", "conj", "sort", "median",   # plan 0937: the order statistics of the m chain readings and their median
]

# [tables] is deliberately absent: CC's tables are TOML data whose totality and partition are
# checked by `bin/cc validate` (cc/declare.py), not by checks.py C6.

[closure.measure]               # plan 0886: the measurement closure, declared. Membership is COMPUTED (schema.import_closure); only these two lists are data.
entries = ["cc/detect.py", "cc/door.py"]        # + each input's instrument modules (seeded at measure time: schema.MEASURE_SEEDED)
outside = ["cc/navigate.py", "cc/navmap.py", "cc/declare.py", "cc/author.py", "cc/view.py", "cc/score.py", "cc/family.py", "cc/transducer.py", "cc/fingerprint.py", "bin/cc", "cc/intake.py", "cc/intake_fold.py", "cc/intake_evidence.py", "cc/intake_bytes.py", "cc/intake_census.py", "cc/intake_say.py", "cc/intake_blind.py", "cc/intake_seal.py", "cc/intake_read.py", "cc/intake_names.py", "cc/intake_choices.py", "cc/intake_feasible.py", "cc/intake_terminal.py", "cc/intake_synth.py", "cc/intake_convert.py", "cc/intake_new.py", "cc/intake_differs.py", "cc/intake_blindview.py", "cc/intake_profile.py", "cc/intake_against.py", "cc/intake_findings.py", "cc/intake_feature.py", "cc/intake_suspect.py"]
