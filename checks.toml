# checks.toml - criticality-compass. Every listed file exists; a file is added in the phase
# (and the edit) that creates it.
[roles]
maths = [
  "cc/kernel.py", "cc/sign.py", "cc/resample.py", "cc/project.py", "cc/readout.py",
  "cc/instruments/needle.py", "cc/instruments/across.py", "cc/instruments/stability.py",
  "cc/instruments/two_start.py", "cc/instruments/along.py", "cc/instruments/fluct.py", "cc/instruments/report.py", "cc/instruments/needle_chain.py", "cc/instruments/across_delta.py", "cc/instruments/stability_delta.py", "cc/instruments/transform.py", "cc/fingerprint.py", "cc/reduce.py", "cc/gamma.py", "cc/navigate.py",
]
plumbing = ["bin/cc", "cc/admit.py", "cc/schema.py", "cc/declare.py", "cc/author.py", "cc/door.py", "cc/formats.py", "cc/detect.py", "cc/resources.py", "cc/view.py", "cc/score.py", "cc/reverdict.py", "cc/family.py", "cc/registry.py", "cc/transducer.py", "cc/navmap.py", "tests/reference/verdict_x.py", "tests/trace/sitecustomize.py", "docs/gen-verdicts.py",
  ".githooks/pre-commit"]
intake = ["cc/intake.py"]   # plan 1164 (Layout C): the command-line surface, the only intake module that prints or exits (tests/test_budget.py INTAKE_CAP; the split core stays within CORE_CAP 1200)
intake_fold = ["cc/intake_fold.py"]   # plan 1164: the run fold and the verdict tables, total and blind (FOLD_CAP)
intake_evidence = ["cc/intake_evidence.py"]   # plan 1164: the evidence types of S3-S10, value-free and blind (EVIDENCE_CAP)
intake_bytes = ["cc/intake_bytes.py"]   # plan 1164: S3 and S6, the only stage module that opens a data byte, through the t23 loader (BYTES_CAP)
intake_census = ["cc/intake_census.py"]   # plan 1164: S4 and S5, reads bytes only from a Pinned (CENSUS_CAP)
intake_say = ["cc/intake_say.py", "docs/gen-intake.py"]   # plan 1164: explain and the report, every sentence from STAGES.toml (SAY_CAP)
intake_blind = ["cc/intake_blind.py"]   # plan 1164: S0 FORMAT and the shared values (BLIND_CAP)
intake_seal = ["cc/intake_seal.py"]   # plan 1164: S2 SEAL (SEAL_CAP)
intake_read = ["cc/intake_read.py"]   # plan 1164: the readers (READ_CAP)
benchmark = []
intake_handoff = ["cc/intake_convert.py"]   # plan 1160 P3: the conversion of a deposit into a canonical bank, and peek; its own cap (tests/test_budget.py HANDOFF_CAP), so INTAKE_CAP stays 1200
intake_choices = ["cc/intake_choices.py"]   # plan 1160 P4: S1 CHOICES, every row (moved out of intake_blind with its own cap, tests/test_budget.py CHOICES_CAP), so INTAKE_CAP stays 1200
intake_terminal = ["cc/intake_terminal.py"]   # plan 1160 P6: S10 KERNEL_HANDOFF and the terminal, with its own cap (tests/test_budget.py TERMINAL_CAP), so INTAKE_CAP stays 1200
intake_feasible = ["cc/intake_feasible.py"]   # plan 1160 P5: S7, S8 and S9, with its own cap (tests/test_budget.py FEASIBLE_CAP), so INTAKE_CAP stays 1200
intake_names = ["cc/intake_names.py"]   # plan 1160 P2: the name classifier and Detail of the intake, moved out of intake_blind with its own cap (tests/test_budget.py NAMES_CAP), so INTAKE_CAP stays 1200
intake_differs = ["cc/intake_differs.py"]   # plan 1160 A34: what a file differs from the first in (S5 FILE_DIFFERS_FROM_FIRST), with its own cap (tests/test_budget.py DIFFERS_CAP), so CORE_CAP stays 1200
intake_blindview = ["cc/intake_blindview.py"]   # plan 1160 A41: `bin/cc intake blind`, the blinded view of a RESERVED run, with its own cap (tests/test_budget.py BLINDVIEW_CAP), so CORE_CAP stays 1200
intake_profile = ["cc/intake_profile.py"]   # plan 1165: pre-processing, `bin/cc intake profile` (the PROFILE before the declaration), with its own cap (tests/test_budget.py PROFILE_CAP), so CORE_CAP stays 1200
intake_against = ["cc/intake_against.py"]   # plan 1165 D5: the cross-check (`profile --check`, S3), split from intake_profile, its own cap (tests/test_budget.py AGAINST_CAP)
intake_findings = ["cc/intake_findings.py"]   # plan 1165 fix S11.P2b F3: the findings table (FindingKind, RESPONSE, RAISES), split from intake_profile at its cap, its own cap (tests/test_budget.py FINDINGS_CAP)
intake_feature = ["cc/intake_feature.py"]   # plan 1176 phase B: the R1 feature projection (POLICY [feature_projection]) and the real-data side oracle, its own cap (tests/test_budget.py FEATURE_CAP)
intake_suspect = ["cc/intake_suspect.py"]   # plan 1176 phase A: FORMAT v14's optional [plane] and [suspect], the suspect polyline in grid cells, its own cap (tests/test_budget.py SUSPECT_CAP)
intake_new = ["cc/intake_new.py"]   # plan 1164: `bin/cc new intake`, moved out of cc/intake.py with its own cap (tests/test_budget.py NEW_CAP)
test_infrastructure = ["cc/intake_synth.py", "tests/intake_plant.py"]   # plan 1139: the planted synthetic bank of `bin/cc intake synth`; plan 1145: the planted inputs of the intake tests; outside the measurement closure
methods = ["cc/detect.py"]
tests = [
