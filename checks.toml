  "tests/test_structure_gate.py", "tests/test_no_host_paths.py", "tests/test_wheel.py", "tests/test_install_refuses.py", "tests/test_data_root.py", "tests/test_kernel_rs_bitwise.py", "tests/test_launcher.py", "tests/test_kernel_identity_key.py", "tests/test_pin_history.py", "tests/test_chains.py", "tests/test_chains_declare.py", "tests/test_v10_readable.py", "tests/test_island_table.py", "tests/test_occupied.py", "tests/test_report.py", "tests/test_expect.py", "tests/test_registry.py", "tests/test_intake.py", "tests/test_intake_example.py", "tests/test_intake_cli.py", "tests/test_intake_read.py", "tests/test_intake_long.py", "tests/test_intake_reach.py",   # plan 1139: the intake from the command line; plan 1136: the intake; plan 0929 (+ plan 0884 P2: island table, windows, occupied maths)
