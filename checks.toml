  "cc/instruments/needle.py", "cc/instruments/across.py", "cc/instruments/stability.py",
  "cc/instruments/two_start.py", "cc/instruments/along.py", "cc/instruments/fluct.py", "cc/instruments/report.py", "cc/instruments/needle_chain.py", "cc/instruments/across_delta.py", "cc/instruments/stability_delta.py", "cc/instruments/transform.py", "cc/fingerprint.py", "cc/reduce.py", "cc/gamma.py",
]
plumbing = ["bin/cc", "cc/admit.py", "cc/schema.py", "cc/declare.py", "cc/author.py", "cc/door.py", "cc/formats.py", "cc/detect.py", "cc/resources.py", "cc/view.py", "cc/score.py", "cc/reverdict.py", "cc/family.py", "cc/registry.py", "cc/transducer.py", "tests/reference/verdict_x.py", "tests/trace/sitecustomize.py", "docs/gen-verdicts.py",
