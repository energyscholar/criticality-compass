# intake/FORMAT.toml - declaration format v2 (plan 1136, amendment A2 ruling Q5; plan 1145): the S0 FORMAT schema as DATA. S0
# (cc/intake_blind.py) walks this table and emits the reason codes of intake/STAGES.toml directly; it holds no per-field code. Every field is
# required. A field that exists only for one reader, layout or kind is a field of that VARIANT row: never an optional field, and never a
# field written "" or [] where it does not apply.
# v2 against v1 (plan 1145): [source] reader and layout leave [source]; [reader] is a VARIANT on its name (a table per reader); [selection]
# is a VARIANT on its layout (PER_FILE | LONG_TABLE) and holds the slow knob's source ([selection.slow], a VARIANT per layout, the v1 value
# PER_FILE renamed LISTED); [knobs.slow] keeps its name and unit; [measured.uncertainty] declares an uncertainty column or NONE (plan-1139
# E4); a column (REF) is a name or a 1-based position.
# A field row: type = str | int | num | list | table | ref (cc/intake_blind.py TYPE); check = one of cc/intake_blind.py CHECK:
#   TEXT      any text but the template's "TODO"
#   NUMBER    any number
#   REF       a column: a name (text) or a 1-based position (an integer); "TODO" is VALUE_STILL_TODO
#   CLOSED    `values` (value -> ADMIT or a reason code) plus every key of each `admit` source (policy.projection | policy.bridge |
#             alphabet.<name> of cc.toml); a value in neither is the `absent` reason; "TODO" is VALUE_STILL_TODO
#   ITEMS     a list whose every item has type `item`
#   TABLE     a table with its own `fields`
#   TABLES    a list of tables, each with `fields`
#   INTERVAL  a table whose fields are cc.toml [interval_fields.<method>] for its `method` (required and optional)
#   VARIANT   a table whose `select` field holds one key of `variants` (a closed list: another value is VALUE_NOT_LISTED); its other fields
#             are exactly that row's
# A key that is no field row is FIELD_IS_STAMPED when it is in `stamped`, FIELD_IS_DERIVED when in `derived`, else FIELD_UNKNOWN.
schema = 1
kind = "intake-format"
version = "1145-v2"
header = { schema = 2, kind = "intake" }
stamped = ["sealed_at", "author", "author_kind", "confirmed_by", "declaration_sha256", "code_identity", "protocol_identity", "universe_listing", "sampling", "pins"]
derived = ["correlated"]

[fields]
schema = { type = "int", check = "NUMBER" }
kind = { type = "str", check = "TEXT" }
id = { type = "str", check = "TEXT" }

[fields.intake]
type = "table"
check = "TABLE"
[fields.intake.fields]
mode = { type = "str", check = "CLOSED", admit = [], absent = "VALUE_NOT_LISTED", values = { PROSPECTIVE = "ADMIT", RETROSPECTIVE_PREDECLARED = "ADMIT", EXPLORATORY = "ADMIT" } }

[fields.basis]
type = "table"
check = "TABLE"
[fields.basis.fields.read]
type = "list"
check = "TABLES"
[fields.basis.fields.read.fields]
what = { type = "str", check = "TEXT" }
class = { type = "str", check = "CLOSED", admit = [], absent = "VALUE_NOT_LISTED", values = { README = "ADMIT", LISTING = "ADMIT", HEADER = "ADMIT", UNITS_NOTE = "ADMIT", ACQUISITION_NOTE = "ADMIT", PAPER_METHODS = "ADMIT", READER_CODE = "ADMIT", ANALYSIS_CODE = "BASIS_NOT_METADATA", DATA_VALUES = "BASIS_NOT_METADATA", FIGURE = "BASIS_NOT_METADATA" } }

[fields.source]
type = "table"
check = "TABLE"
[fields.source.fields]
origin = { type = "str", check = "CLOSED", admit = [], absent = "VALUE_NOT_LISTED", values = { PLANTED = "ADMIT", EXPERIMENT = "ADMIT" } }
deposit = { type = "str", check = "TEXT" }
root = { type = "str", check = "TEXT" }
universe = { type = "str", check = "TEXT" }
truth_side = { type = "list", check = "ITEMS", item = "str" }

[fields.reader]   # a table per reader (plan 1145): `name` selects the row; the reader's own fields are exactly that row's
type = "table"
check = "VARIANT"
select = "name"
[fields.reader.variants."csv-curve-v1"]     # the synthetic bank's reader: one header line that IS the declared columns in role order, then rows of numbers
[fields.reader.variants."table-curve-v1"]   # a text or Excel table; columns by name or by 1-based position
comment = { type = "list", check = "ITEMS", item = "str" }   # line prefixes that mark a comment line, dropped before the header is counted ([] for none)
[fields.reader.variants."table-curve-v1".format]
type = "table"
check = "VARIANT"
select = "kind"
variants = { COMMA = {}, TAB = {}, WHITESPACE = {}, XLSX = { sheet = { type = "str", check = "TEXT" } } }
[fields.reader.variants."table-curve-v1".header]
type = "table"
check = "VARIANT"
select = "kind"
[fields.reader.variants."table-curve-v1".header.variants]
SKIP = { rows = { type = "int", check = "NUMBER" } }   # `rows` header lines, none of them names: columns by position only
NAMES = { rows = { type = "int", check = "NUMBER" }, names = { type = "int", check = "NUMBER" } }   # `names`: the 1-based header line of column names
NAMES_UNITS = { rows = { type = "int", check = "NUMBER" }, names = { type = "int", check = "NUMBER" }, units = { type = "int", check = "NUMBER" } }   # and of units
[fields.reader.variants.P1]
[fields.reader.variants.L5]
[fields.reader.variants.F1]
[fields.reader.variants.C1]
[fields.reader.variants.C4]
[fields.reader.variants."npz-curve-v1"]

[fields.selection]   # a VARIANT per layout (plan 1145): one file per curve, or one long table whose slow knob is a column
type = "table"
check = "VARIANT"
select = "layout"
[fields.selection.variants.PER_FILE]
pattern = { type = "str", check = "TEXT" }
excluded = { type = "list", check = "TABLES", fields = { file = { type = "str", check = "TEXT" }, why = { type = "str", check = "TEXT" } } }
[fields.selection.variants.PER_FILE.index]
type = "table"
check = "TABLE"
fields = { first = { type = "int", check = "NUMBER" }, last = { type = "int", check = "NUMBER" } }
[fields.selection.variants.PER_FILE.slow]   # where each file's slow-knob value comes from, before any byte is read
type = "table"
check = "VARIANT"
select = "source"
[fields.selection.variants.PER_FILE.slow.variants]
LISTED = { per_file = { type = "list", check = "ITEMS", item = "num" } }   # one number per selected file, in index order
PATH_PATTERN = { pattern = { type = "str", check = "TEXT" } }              # a regular expression with one group, matched against the file name
FILE_KEY = { key = { type = "str", check = "TEXT" } }                      # a key inside the file (never resolvable before the file is read)
[fields.selection.variants.LONG_TABLE]
file = { type = "str", check = "TEXT" }   # the one file, under root, that holds every curve
excluded = { type = "list", check = "TABLES", fields = { file = { type = "str", check = "TEXT" }, why = { type = "str", check = "TEXT" } } }
[fields.selection.variants.LONG_TABLE.slow]   # the slow knob is a column; a curve is a block of consecutive rows with one slow value, in file order
type = "table"
check = "VARIANT"
select = "source"
variants = { COLUMN = { key = { type = "ref", check = "REF" } } }

[fields.knobs]
type = "table"
check = "TABLE"
[fields.knobs.fields.slow]
type = "table"
check = "TABLE"
[fields.knobs.fields.slow.fields]
name = { type = "str", check = "TEXT" }
unit = { type = "str", check = "TEXT" }
[fields.knobs.fields.fast]
type = "table"
check = "TABLE"
[fields.knobs.fields.fast.fields]
name = { type = "str", check = "TEXT" }
unit = { type = "str", check = "TEXT" }
source = { type = "str", check = "CLOSED", admit = [], absent = "VALUE_NOT_LISTED", values = { COLUMN = "ADMIT", FILE_KEY = "ADMIT" } }
key = { type = "ref", check = "REF" }

[fields.measured]
type = "table"
check = "TABLE"
[fields.measured.fields]
name = { type = "str", check = "TEXT" }
unit = { type = "str", check = "TEXT" }
key = { type = "ref", check = "REF" }
shape = { type = "str", check = "CLOSED", admit = [], absent = "VALUE_NOT_LISTED", values = { SCALAR_PER_LOCUS = "ADMIT", SERIES_PER_LOCUS = "ADMIT", PICTURE = "ADMIT", POSITIONS = "ADMIT" } }
[fields.measured.fields.uncertainty]   # plan-1139 E4: the measured number's declared uncertainty column, or NONE (never a hard-coded name)
type = "table"
check = "VARIANT"
select = "kind"
variants = { COLUMN = { key = { type = "ref", check = "REF" } }, NONE = {} }

[fields.acquisition]
type = "table"
check = "TABLE"
[fields.acquisition.fields]
mode = { type = "str", check = "CLOSED", admit = [], absent = "VALUE_NOT_LISTED", values = { INDEPENDENT = "ADMIT", SWEEP_CARRIED = "ADMIT", RAMP_CONTINUOUS = "ADMIT", REPEATED_FRAMES = "ADMIT" } }
direction = { type = "str", check = "CLOSED", admit = [], absent = "VALUE_NOT_LISTED", values = { ASCENDING = "ADMIT", DESCENDING = "ADMIT", UNORDERED = "ADMIT" } }
row_order = { type = "str", check = "CLOSED", admit = [], absent = "VALUE_NOT_LISTED", values = { ASCENDING = "ADMIT", DESCENDING = "ADMIT", ACQUISITION = "ADMIT" } }

[fields.replicate]
type = "table"
check = "TABLE"
[fields.replicate.fields]
identity = { type = "str", check = "CLOSED", admit = [], absent = "VALUE_NOT_LISTED", values = { NONE = "ADMIT", SEED = "ADMIT", RUN = "ADMIT", SAMPLE = "ADMIT", FILE = "ADMIT" } }
key = { type = "str", check = "TEXT" }

[fields.interval]
type = "table"
check = "INTERVAL"
method = { type = "str", check = "CLOSED", admit = ["alphabet.interval_method"], absent = "VALUE_NOT_LISTED", values = {} }

[fields.bracket]   # amendment A2 ruling Q8: the most a declaration requires of a bracket; VALIDATED_BRACKET needs frozen coverage evidence (S8)
type = "table"
check = "TABLE"
[fields.bracket.fields]
required = { type = "str", check = "CLOSED", admit = [], absent = "VALUE_NOT_LISTED", values = { CANDIDATE_BRACKET = "ADMIT", VALIDATED_BRACKET = "ADMIT" } }

[fields.projection]
type = "list"
check = "TABLES"
[fields.projection.fields]
lane = { type = "str", check = "CLOSED", admit = [], absent = "VALUE_NOT_LISTED", values = { PRIMARY = "ADMIT", ALTERNATIVE = "ADMIT" } }
from = { type = "str", check = "TEXT" }
to = { type = "str", check = "TEXT" }
bias = { type = "str", check = "CLOSED", admit = ["policy.projection"], absent = "BIAS_KEY_UNDECLARED", values = { INTERPOLATE = "STEP_IS_INTERPOLATION" } }
keeps = { type = "str", check = "TEXT" }
discards = { type = "str", check = "TEXT" }

[fields.bridge]
type = "list"
check = "TABLES"
[fields.bridge.fields]
lane = { type = "str", check = "CLOSED", admit = [], absent = "VALUE_NOT_LISTED", values = { PRIMARY = "ADMIT", ALTERNATIVE = "ADMIT" } }
on = { type = "str", check = "TEXT" }
template = { type = "str", check = "CLOSED", admit = ["policy.bridge"], absent = "VALUE_NOT_LISTED", values = { NONE_FITS = "BRIDGE_NONE_FITS", INTERPOLATE = "STEP_IS_INTERPOLATION" } }
bias = { type = "str", check = "CLOSED", admit = ["policy.bridge"], absent = "BIAS_KEY_UNDECLARED", values = { INTERPOLATE = "STEP_IS_INTERPOLATION" } }

[fields.shift]
type = "table"
check = "TABLE"
[fields.shift.fields]
c = { type = "num", check = "NUMBER" }
