# intake/FORMAT.toml - declaration format v5, schema 5 (plan 1160 A35; format v4 was schema 4, format v3 schema 3) (plan 1136, amendment A2 ruling Q5; plan 1145; plan 1160 P1): the S0 FORMAT schema as DATA. S0
# (cc/intake_blind.py) walks this table and emits the reason codes of intake/STAGES.toml directly; it holds no per-field code. Every field is
# required, except a row that states required = false (v14: [plane], [plane.slice] and [suspect] only). A field that exists only for one reader, layout, kind or source is a field of that VARIANT row: never an optional field, and never
# a field written "" or [] where it does not apply.
# v2 against v1 (plan 1145): [source] reader and layout leave [source]; [reader] is a VARIANT on its name (a table per reader); [selection]
# is a VARIANT on its layout (PER_FILE | LONG_TABLE) and holds the slow knob's source ([selection.slow], a VARIANT per layout, the v1 value
# PER_FILE renamed LISTED); [knobs.slow] keeps its name and unit; [measured.uncertainty] declares an uncertainty column or NONE (plan-1139
# E4); a column (REF) is a name or a 1-based position.
# v3 against v2 (plan 1160 P1): PER_FILE names its files as an explicit list `files`, in curve order (`pattern` and `index` are deleted);
# its [selection.slow] is LISTED (`values`: one numeral TEXT per file, in `files` order) | FILE_KEY (`key`: a header line of each file) |
# NONE (no slow knob); PATH_PATTERN is deleted. [source] is a VARIANT on `kind` (DEPOSIT: the files as deposited | CONVERTED: a bank written
# by a declared conversion, with `converted_from` | BLINDED: the ordinal-named view of `bin/cc intake blind`, plan 1160 A41) and states `admissibility`, the deposit's class as the declarer reads it from metadata.
# v4 against v3 (plan 1160 P2): [replicate] identity SAME_FAST_VALUE (consecutive rows of one curve with an equal fast value are the
# readings of one point). Additive within schema 3: every v3 declaration is a v4 declaration.
# v5 against v4 (plan 1160 P2): a LONG_TABLE states `block`: EXACT (a curve is a run of rows with one slow value, the v4 rule) |
# FAST_RESTART (a curve ends where the fast knob turns back against its direction; its slow value is its first row's). Required, so a v4
# LONG_TABLE declaration adds `block = "EXACT"`; schema stays 3 (no committed declaration is a LONG_TABLE).
# v6 against v5 (plan 1160 P2): [reader.header] kind NAMES_UNITS_IN_NAMES (rows, names, unit_syntax PAREN | SLASH): the units are inside
# the names cells, "T (K)" or "T/K"; a column is declared by its bare name ("T"), and a names cell with no unit states none. Additive.
# v7 against v6 (plan 1160 P3): every VARIANT states its selector's `absent` reason (VALUE_NOT_LISTED, as the code held it). No field changes.
# v8 against v7 (plan 1160 P4): the intake's interval alphabet is cc.toml alphabets.interval_method | STATED | NONE (intake-owned; cc.toml
# is not touched). STATED: the declared uncertainty column is each point's interval (S1 METHOD_NEEDS_UNCERTAINTY_COLUMN refuses it without
# one); NONE: the declarer pre-registers that no interval exists. Their fields are [interval_fields.STATED] and [interval_fields.NONE] below,
# merged over cc.toml's by cc/intake.py tables() ([interval_fields.block] too, plan 1160 A4: min_blocks required): no field beyond `method` (each table holds required and optional, both empty, the shape
# the INTERVAL check reads).
# v9 against v8 (plan 1160 A17, schema 4): [knobs.fast] states `control`: SET (the knob was set to each value, a grid: two rows at one
# fast value are one point read twice, or a repeat S5 refuses; the meaning of every schema-3 declaration, so one restated as format v4, schema 4, adds control = "SET") |
# MEASURED (the knob was read, not set, as a ramp or a carried sweep reads its thermometer: every row is a point, keyed by its ordinal, and
# S1 MEASURED_KNOB_HAS_NO_POINTS admits only replicate identity NONE with interval method STATED or NONE).
# v10 against v9 (plan 1160 A21): [reader.format] XLSX `sheet` is a name or a 1-based position (type ref). Additive within schema 4.
# v11 against v10 (plan 1160 A35, schema 5): [knobs.slow] states `kind`: QUANTITY (a physical quantity with a metric: a field, a temperature)
# | ORDINAL (an index or a category: a run number, a cycle index, a sample label); S1 SLOW_KNOB_HAS_NO_METRIC refuses ORDINAL. A v4
# declaration restated as v5 adds kind = "QUANTITY" (the v4 meaning).
# v13 against v12 (plan 1160 A41, schema 5): [source] gains the variant BLINDED, a RESERVED run's ordinal-named view (`bin/cc intake blind`);
# its root is under <cc-blind>/ (S0 ROOT_NOT_UNDER_CC_BLIND), and an UNDER check names its own reason (`refused`) and form (`want`).
# v12 against v11 (plan 1160 A33, still schema 5: loop 4 builds v5 whole): [replicate] key is a table [replicate.key], VARIANT on kind:
# NONE (no key) | FILE_NAME (separator, field: the 1-based field of the file name without its extension, split on the separator; PER_FILE)
# | COLUMN (column: a column holding one number per curve; it is read as a role column before the slow column). A v4 `key = ""` is
# [replicate.key] kind = "NONE".
# v14 against v13 (plan 1176 phase A, still schema 5): two OPTIONAL sections, the navigator's plane and the user's suspect line; a row
# with required = false may be absent (S0 walks it only when present). [plane] axes "slow-fast" (the alphabet now; "slow-slow2" arrives
# with plan 1176 phase 2b) and an optional [plane.slice] (column, value): the one value of the declared [replicate.key] COLUMN that fixes
# a second knob. [suspect] vertices [[slow, fast], ...] in the declared knobs' physical units, and corridor "grid" (the frozen linenav grid
# PARAMS, w_c 5 cells). The suspect is the declarer's GUESS, never data: cc/intake_suspect.py converts it to cells (curve rank, sample
# rank) by an exact slow match and the in-span nearest sample, and refuses it typed otherwise. Additive: every v13 declaration is a v14
# declaration and lints byte-identically.
# v15 against v14 (plan 1176 phase C'', O4, still schema 5): [suspect] corridor gains "continuous": the plane in the declared knobs' physical
# units, each normalised to its declared span (POLICY [coordinate.PLANE_SPAN_UNIT]), walked by linenav in CONTINUOUS mode with its frozen
# PARAMS (w_c 0.15 of each span). "grid" stays admitted (a v14 declaration lints identically) but `cc navigate family` refuses it typed
# (CORRIDOR_GRID_RETIRED): open decision 2 reversed, grid cells to physical units. Additive.
# v16 against v15 (plan 1176 amendment E0, still schema 5): an optional [plane.fast_window] (lo, hi), in the fast knob's physical unit,
# declared before data: the DOMAIN of the feature projection (POLICY [feature_projection.FEATURE_ARGMAX_FAST] domain), never a value
# transform and never a row filter (no curve is edited). Absent: the whole span (every v15 declaration lints and navigates identically).
# A reader's `comment` prefixes are PREFIXES: an empty prefix marks every line a comment, so it is refused (COMMENT_PREFIX_EMPTY).
# A field row: type = str | int | num | list | table | ref (cc/intake_blind.py TYPE); check = one of cc/intake_blind.py CHECK:
#   TEXT      any text but the template's "TODO"
#   NUMBER    any number
#   REF       a column: a name (text) or a 1-based position (an integer); "TODO" is VALUE_STILL_TODO
#   CLOSED    `values` (value -> ADMIT or a reason code) plus every key of each `admit` source (policy.projection | policy.bridge |
#             alphabet.<name> of cc.toml); a value in neither is the `absent` reason; "TODO" is VALUE_STILL_TODO
#   ITEMS     a list whose every item has type `item` (an item type is a TYPE row: numeral is text that is a decimal number as written)
#   PREFIXES  a list of line prefixes: every item a str, and none of them "" (COMMENT_PREFIX_EMPTY)
#   TABLE     a table with its own `fields`
#   TABLES    a list of tables, each with `fields`
#   INTERVAL  a table whose fields are [interval_fields.<method>] (cc.toml's, and this file's for STATED and NONE) for its `method`
#   VARIANT   a table whose `select` field holds one key of `variants` (a closed list: another value is the `absent` reason, here always
#             VALUE_NOT_LISTED; plan 1160 P3 moved it from the code to this table); its other fields are exactly that row's
#   VARIANTS  a list of VARIANT tables (plan 1160 P3; intake/CONVERSION.toml's steps, unused here)
# A key that is no field row is FIELD_IS_STAMPED when it is in `stamped`, FIELD_IS_DERIVED when in `derived`, else FIELD_UNKNOWN.
schema = 1
kind = "intake-format"
version = "1160-v16"   # plan 1176 amendment E0: optional [plane.fast_window] (lo, hi), the feature projection's domain, schema 5
# was "1160-v15"   # plan 1176 phase C'': [suspect] corridor gains "continuous" (span units), schema 5
# was "1160-v14"   # plan 1176 phase A: optional [plane] (axes, [plane.slice]) and [suspect] (vertices, corridor), schema 5
# was "1160-v13"   # plan 1160 A41: [source] kind BLINDED (root under <cc-blind>/, blinded_from, key_sha256), schema 5;
# was "1160-v12"   # plan 1160 A33: [replicate.key] VARIANT on kind NONE | FILE_NAME (separator, field) | COLUMN (column), in schema 5 (loop 4 builds v5 whole);
# was "1160-v11"   # plan 1160 A35: [knobs.slow] kind QUANTITY | ORDINAL, schema 5; plan 1160 A21: [reader.format] XLSX sheet a name or a position; plan 1160 A17: [knobs.fast] control, schema 4
header = { schema = 5, kind = "intake" }
stamped = ["sealed_at", "author", "author_kind", "confirmed_by", "declaration_sha256", "code_identity", "protocol_identity", "universe_listing", "sampling", "pins"]
derived = ["correlated"]

[fields]
schema = { type = "int", check = "NUMBER" }
kind = { type = "str", check = "TEXT" }
id = { type = "str", check = "TEXT" }

[fields.intake]
type = "table"
check = "TABLE"
[fields.intake.fields]
mode = { type = "str", check = "CLOSED", admit = [], absent = "VALUE_NOT_LISTED", values = { PROSPECTIVE = "ADMIT", RETROSPECTIVE_PREDECLARED = "ADMIT", EXPLORATORY = "ADMIT" } }

[fields.basis]
type = "table"
check = "TABLE"
[fields.basis.fields.read]
type = "list"
check = "TABLES"
[fields.basis.fields.read.fields]
what = { type = "str", check = "TEXT" }
class = { type = "str", check = "CLOSED", admit = [], absent = "VALUE_NOT_LISTED", values = { README = "ADMIT", LISTING = "ADMIT", HEADER = "ADMIT", UNITS_NOTE = "ADMIT", ACQUISITION_NOTE = "ADMIT", PAPER_METHODS = "ADMIT", READER_CODE = "ADMIT", ANALYSIS_CODE = "BASIS_NOT_METADATA", DATA_VALUES = "BASIS_NOT_METADATA", FIGURE = "BASIS_NOT_METADATA" } }

[fields.source]   # a VARIANT on kind (plan 1160 P1): the deposit's files read as they are, or a bank written from them by a declared conversion
type = "table"
check = "VARIANT"
select = "kind"
absent = "VALUE_NOT_LISTED"
[fields.source.variants.DEPOSIT]   # the files as deposited, read directly
origin = { type = "str", check = "CLOSED", admit = [], absent = "VALUE_NOT_LISTED", values = { PLANTED = "ADMIT", EXPERIMENT = "ADMIT" } }
deposit = { type = "str", check = "TEXT" }
root = { type = "str", check = "TEXT" }
universe = { type = "str", check = "TEXT" }
truth_side = { type = "list", check = "ITEMS", item = "str" }
admissibility = { type = "str", check = "CLOSED", admit = [], absent = "VALUE_NOT_LISTED", values = { RAW = "ADMIT", DECLARABLE = "ADMIT", FIGURE_LEVEL = "ADMIT", PROCESSED_UNDECLARABLE = "ADMIT" } }
[fields.source.variants.CONVERTED]   # a bank under <cc-banks> written by the declared conversion of the deposit at converted_from (plan 1160 P3)
origin = { type = "str", check = "CLOSED", admit = [], absent = "VALUE_NOT_LISTED", values = { PLANTED = "ADMIT", EXPERIMENT = "ADMIT" } }
deposit = { type = "str", check = "TEXT" }
root = { type = "str", check = "UNDER", under = "<cc-banks>/", want = "<id>/bank", refused = "ROOT_NOT_UNDER_CC_BANKS" }   # a converted bank lives under <cc-banks> (ROOTS.toml, plan 1160 P3)
universe = { type = "str", check = "TEXT" }
truth_side = { type = "list", check = "ITEMS", item = "str" }
admissibility = { type = "str", check = "CLOSED", admit = [], absent = "VALUE_NOT_LISTED", values = { RAW = "ADMIT", DECLARABLE = "ADMIT", FIGURE_LEVEL = "ADMIT", PROCESSED_UNDECLARABLE = "ADMIT" } }
converted_from = { type = "str", check = "TEXT" }   # "<cc-datasets>/<id>/raw": the deposit the conversion read
[fields.source.variants.BLINDED]   # (plan 1160 A41) the blinded view `bin/cc intake blind` made: ordinal-named links, the names' key unread
origin = { type = "str", check = "CLOSED", admit = [], absent = "VALUE_NOT_LISTED", values = { PLANTED = "ADMIT", EXPERIMENT = "ADMIT" } }
deposit = { type = "str", check = "TEXT" }
root = { type = "str", check = "UNDER", under = "<cc-blind>/", want = "<id>", refused = "ROOT_NOT_UNDER_CC_BLIND" }   # the view, never the deposit
universe = { type = "str", check = "TEXT" }
truth_side = { type = "list", check = "ITEMS", item = "str" }
admissibility = { type = "str", check = "CLOSED", admit = [], absent = "VALUE_NOT_LISTED", values = { RAW = "ADMIT", DECLARABLE = "ADMIT", FIGURE_LEVEL = "ADMIT", PROCESSED_UNDECLARABLE = "ADMIT" } }
blinded_from = { type = "str", check = "TEXT" }   # "<name>/<path>": the deposit's directory the view links to
key_sha256 = { type = "str", check = "TEXT" }   # the sha256 `bin/cc intake blind` printed for <cc-blind>/<id>.KEY.json: the seal records it

[fields.reader]   # a table per reader (plan 1145): `name` selects the row; the reader's own fields are exactly that row's
type = "table"
check = "VARIANT"
select = "name"
absent = "VALUE_NOT_LISTED"
[fields.reader.variants."csv-curve-v1"]     # the synthetic bank's reader: one header line that IS the declared columns in role order, then rows of numbers
[fields.reader.variants."table-curve-v1"]   # a text or Excel table; columns by name or by 1-based position
comment = { type = "list", check = "PREFIXES", item = "str" }   # line prefixes that mark a comment line, dropped before the header is counted ([] for none; never "")
[fields.reader.variants."table-curve-v1".format]
type = "table"
check = "VARIANT"
select = "kind"
absent = "VALUE_NOT_LISTED"
variants = { COMMA = {}, TAB = {}, WHITESPACE = {}, XLSX = { sheet = { type = "ref", check = "REF" } } }   # plan 1160 A21: a sheet by name or 1-based position
[fields.reader.variants."table-curve-v1".header]
type = "table"
check = "VARIANT"
select = "kind"
absent = "VALUE_NOT_LISTED"
[fields.reader.variants."table-curve-v1".header.variants]
SKIP = { rows = { type = "int", check = "NUMBER" } }   # `rows` header lines, none of them names: columns by position only
NAMES = { rows = { type = "int", check = "NUMBER" }, names = { type = "int", check = "NUMBER" } }   # `names`: the 1-based header line of column names
NAMES_UNITS = { rows = { type = "int", check = "NUMBER" }, names = { type = "int", check = "NUMBER" }, units = { type = "int", check = "NUMBER" } }   # and of units
NAMES_UNITS_IN_NAMES = { rows = { type = "int", check = "NUMBER" }, names = { type = "int", check = "NUMBER" }, unit_syntax = { type = "str", check = "CLOSED", admit = [], absent = "VALUE_NOT_LISTED", values = { PAREN = "ADMIT", SLASH = "ADMIT" } } }   # 1160 P2: each names cell "name (unit)" (PAREN) or "name/unit" (SLASH)
[fields.reader.variants.P1]
[fields.reader.variants.L5]
[fields.reader.variants.F1]
[fields.reader.variants.C1]
[fields.reader.variants.C4]
[fields.reader.variants."npz-curve-v1"]

[fields.selection]   # a VARIANT per layout (plan 1145): one file per curve, or one long table whose slow knob is a column
type = "table"
check = "VARIANT"
select = "layout"
absent = "VALUE_NOT_LISTED"
[fields.selection.variants.PER_FILE]
files = { type = "list", check = "ITEMS", item = "str" }   # the curve files under root, one curve each, in curve order (plan 1160 P1: the only way to name them)
excluded = { type = "list", check = "TABLES", fields = { file = { type = "str", check = "TEXT" }, why = { type = "str", check = "TEXT" } } }
[fields.selection.variants.PER_FILE.slow]   # where each file's slow-knob value comes from
type = "table"
check = "VARIANT"
select = "source"
absent = "VALUE_NOT_LISTED"
[fields.selection.variants.PER_FILE.slow.variants]
LISTED = { values = { type = "list", check = "ITEMS", item = "numeral" } }   # one decimal number as TEXT per listed file, in `files` order (S1 counts them)
FILE_KEY = { key = { type = "str", check = "TEXT" } }                         # each file's header line whose first cell is `key`; its second cell is the value (read at S5)
NONE = {}                                                                     # the deposit has no slow knob: the curves carry no slow value
[fields.selection.variants.LONG_TABLE]
file = { type = "str", check = "TEXT" }   # the one file, under root, that holds every curve
block = { type = "str", check = "CLOSED", admit = [], absent = "VALUE_NOT_LISTED", values = { EXACT = "ADMIT", FAST_RESTART = "ADMIT" } }   # 1160 P2: where a curve begins
excluded = { type = "list", check = "TABLES", fields = { file = { type = "str", check = "TEXT" }, why = { type = "str", check = "TEXT" } } }
[fields.selection.variants.LONG_TABLE.slow]   # the slow knob is a column; a curve is a block: EXACT, consecutive rows with one slow value; FAST_RESTART, rows up to where the fast knob turns back (its slow value the first row's)
type = "table"
check = "VARIANT"
select = "source"
absent = "VALUE_NOT_LISTED"
variants = { COLUMN = { key = { type = "ref", check = "REF" } } }

[fields.knobs]
type = "table"
check = "TABLE"
[fields.knobs.fields.slow]
type = "table"
check = "TABLE"
[fields.knobs.fields.slow.fields]
name = { type = "str", check = "TEXT" }
unit = { type = "str", check = "TEXT" }
kind = { type = "str", check = "CLOSED", admit = [], absent = "VALUE_NOT_LISTED", values = { QUANTITY = "ADMIT", ORDINAL = "ADMIT" } }   # 1160 A35: ORDINAL is S1 SLOW_KNOB_HAS_NO_METRIC
[fields.knobs.fields.fast]
type = "table"
check = "TABLE"
[fields.knobs.fields.fast.fields]
name = { type = "str", check = "TEXT" }
unit = { type = "str", check = "TEXT" }
source = { type = "str", check = "CLOSED", admit = [], absent = "VALUE_NOT_LISTED", values = { COLUMN = "ADMIT", FILE_KEY = "ADMIT" } }
key = { type = "ref", check = "REF" }
control = { type = "str", check = "CLOSED", admit = [], absent = "VALUE_NOT_LISTED", values = { SET = "ADMIT", MEASURED = "ADMIT" } }   # 1160 A17: set (a grid) or measured (rows are points)

[fields.measured]
type = "table"
check = "TABLE"
[fields.measured.fields]
name = { type = "str", check = "TEXT" }
unit = { type = "str", check = "TEXT" }
key = { type = "ref", check = "REF" }
shape = { type = "str", check = "CLOSED", admit = [], absent = "VALUE_NOT_LISTED", values = { SCALAR_PER_LOCUS = "ADMIT", SERIES_PER_LOCUS = "ADMIT", PICTURE = "ADMIT", POSITIONS = "ADMIT" } }
[fields.measured.fields.uncertainty]   # plan-1139 E4: the measured number's declared uncertainty column, or NONE (never a hard-coded name)
type = "table"
check = "VARIANT"
select = "kind"
absent = "VALUE_NOT_LISTED"
variants = { COLUMN = { key = { type = "ref", check = "REF" } }, NONE = {} }

[fields.acquisition]
type = "table"
check = "TABLE"
[fields.acquisition.fields]
mode = { type = "str", check = "CLOSED", admit = [], absent = "VALUE_NOT_LISTED", values = { INDEPENDENT = "ADMIT", SWEEP_CARRIED = "ADMIT", RAMP_CONTINUOUS = "ADMIT", REPEATED_FRAMES = "ADMIT" } }
direction = { type = "str", check = "CLOSED", admit = [], absent = "VALUE_NOT_LISTED", values = { ASCENDING = "ADMIT", DESCENDING = "ADMIT", UNORDERED = "ADMIT" } }
row_order = { type = "str", check = "CLOSED", admit = [], absent = "VALUE_NOT_LISTED", values = { ASCENDING = "ADMIT", DESCENDING = "ADMIT", ACQUISITION = "ADMIT" } }

[fields.replicate]
type = "table"
check = "TABLE"
[fields.replicate.fields]
identity = { type = "str", check = "CLOSED", admit = [], absent = "VALUE_NOT_LISTED", values = { NONE = "ADMIT", SEED = "ADMIT", RUN = "ADMIT", SAMPLE = "ADMIT", FILE = "ADMIT", SAME_FAST_VALUE = "ADMIT" } }   # SAME_FAST_VALUE (1160 P2): consecutive rows of a curve with one fast value are readings of one point
[fields.replicate.fields.key]   # plan 1160 A33: the key that tells replicates apart, for every layout (was key = "", a TEXT nothing read)
type = "table"
check = "VARIANT"
select = "kind"
absent = "VALUE_NOT_LISTED"
variants = { NONE = {}, FILE_NAME = { separator = { type = "str", check = "TEXT" }, field = { type = "int", check = "NUMBER" } }, COLUMN = { column = { type = "ref", check = "REF" } } }

[fields.interval]
type = "table"
check = "INTERVAL"
method = { type = "str", check = "CLOSED", admit = ["alphabet.interval_method"], absent = "VALUE_NOT_LISTED", values = { STATED = "ADMIT", NONE = "ADMIT" } }   # 1160 P4

[fields.bracket]   # amendment A2 ruling Q8: the most a declaration requires of a bracket; VALIDATED_BRACKET needs frozen coverage evidence (S8)
type = "table"
check = "TABLE"
[fields.bracket.fields]
required = { type = "str", check = "CLOSED", admit = [], absent = "VALUE_NOT_LISTED", values = { CANDIDATE_BRACKET = "ADMIT", VALIDATED_BRACKET = "ADMIT" } }

[fields.projection]
type = "list"
check = "TABLES"
[fields.projection.fields]
lane = { type = "str", check = "CLOSED", admit = [], absent = "VALUE_NOT_LISTED", values = { PRIMARY = "ADMIT", ALTERNATIVE = "ADMIT" } }
from = { type = "str", check = "TEXT" }
to = { type = "str", check = "TEXT" }
bias = { type = "str", check = "CLOSED", admit = ["policy.projection"], absent = "BIAS_KEY_UNDECLARED", values = { INTERPOLATE = "STEP_IS_INTERPOLATION" } }
keeps = { type = "str", check = "TEXT" }
discards = { type = "str", check = "TEXT" }

[fields.bridge]
type = "list"
check = "TABLES"
[fields.bridge.fields]
lane = { type = "str", check = "CLOSED", admit = [], absent = "VALUE_NOT_LISTED", values = { PRIMARY = "ADMIT", ALTERNATIVE = "ADMIT" } }
on = { type = "str", check = "TEXT" }
template = { type = "str", check = "CLOSED", admit = ["policy.bridge"], absent = "VALUE_NOT_LISTED", values = { NONE_FITS = "BRIDGE_NONE_FITS", INTERPOLATE = "STEP_IS_INTERPOLATION" } }
bias = { type = "str", check = "CLOSED", admit = ["policy.bridge"], absent = "BIAS_KEY_UNDECLARED", values = { INTERPOLATE = "STEP_IS_INTERPOLATION" } }

# [shift] is the format's ONE shift, and its one field is c (plan 1160 P5, amendment A3): x + c applies only at the KernelInput boundary. A
# shift written anywhere upstream is a field this format does not define, which S0 refuses FIELD_UNKNOWN, so a shift before the kernel input is
# unreachable by construction (STAGES.toml carries no SHIFT_BEFORE_KERNEL_INPUT row).
[fields.shift]
type = "table"
check = "TABLE"
[fields.shift.fields]
c = { type = "num", check = "NUMBER" }

# [plane] and [suspect] (plan 1176 phase A, v14) are OPTIONAL: required = false, so a v13 declaration without them is unchanged. S0 types
# them; what needs the census (a vertex on a curve, inside its span; a slice where a second knob varies) is cc/intake_suspect.py's.
[fields.plane]
type = "table"
check = "TABLE"
required = false
[fields.plane.fields]
axes = { type = "str", check = "CLOSED", admit = [], absent = "VALUE_NOT_LISTED", values = { "slow-fast" = "ADMIT" } }   # slow-slow2: phase 2b
[fields.plane.fields.slice]   # optional: the plane at one value of a second knob, the declared [replicate.key] COLUMN
type = "table"
check = "TABLE"
required = false
[fields.plane.fields.slice.fields]
column = { type = "ref", check = "REF" }   # the [replicate.key] column, as declared there
value = { type = "num", check = "NUMBER" }   # the curves whose key is exactly this value
[fields.plane.fields.fast_window]   # optional (plan 1176 E0): the feature projection's DOMAIN on the fast knob, declared before data
type = "table"
check = "TABLE"
required = false
[fields.plane.fields.fast_window.fields]
lo = { type = "num", check = "NUMBER" }   # the fast knob's physical unit; lo < hi, inside the plane's measured fast span (typed, never clamped)
hi = { type = "num", check = "NUMBER" }

[fields.suspect]   # the declarer's guess of a line, in the declared knobs' units: never data, never a checkpoint
type = "table"
check = "TABLE"
required = false
[fields.suspect.fields]
vertices = { type = "list", check = "ITEMS", item = "list" }   # [[slow, fast], ...]: two numbers each, at least two (cc/intake_suspect.py)
corridor = { type = "str", check = "CLOSED", admit = [], absent = "VALUE_NOT_LISTED", values = { grid = "ADMIT", continuous = "ADMIT" } }   # a linenav PARAMS key: continuous (C'', span units, w_c 0.15) | grid (retired by navigate)

[interval_fields.STATED]   # plan 1160 P4: no field beyond method; the interval of each point is the declared uncertainty column
required = {}
optional = {}
[interval_fields.NONE]     # plan 1160 P4: no field beyond method; no interval exists (pre-registered)
required = {}
optional = {}
[interval_fields.block]    # plan 1160 P6.0 A4: cc.toml's block row with min_blocks moved from optional to REQUIRED, so S0 refuses a block
#                            interval without its floor (FIELD_MISSING); tests/test_intake.py checks it differs from cc.toml's in that one field
required = { method = "str", resamples = "int", level = "num", seed = "int", b = "int", min_blocks = "int" }
optional = { tau_declared = "int" }
