# intake/ROOTS.toml - the declared names of source roots (plan 1139). A declaration's [source] root is "<name>/<path>": a name below, then a
# relative path under it. S3 SOURCE_INTEGRITY resolves the name here (a path relative to the Compass root, or under the home directory when it
# starts with ~/) and refuses ROOT_UNRESOLVED for a name that is not listed or a directory that does not exist. A declaration never holds a
# machine path.
schema = 1
kind = "intake-roots"

[root]
"<intake-synth>" = "scratch/intake-synth"   # the default --out of `bin/cc intake synth` (gitignored)
"<cc-datasets>" = "~/scratch/cc-datasets"   # plan 1145: the data sets on the data host (docs/INTAKE-ON-A-DATA-HOST.md); ROOT_UNRESOLVED where that directory is absent
"<cc-banks>" = "~/scratch/cc-banks"   # plan 1160 P3: the banks `bin/cc intake convert` writes (docs/INTAKE-CONVERSION.md); a CONVERTED [source] root is under it
