# expected findings for the planted plugins (data; read by tests/test_declare.py).
# file = the planted plugin; over = cross-reference overrides (files here); fix = [as planted, as fixed];
# text = the exact finding block (with its Next line) that the plant must produce.
schema = 1
kind = "planted"

[[plant]]
file = "case-unknown-field.toml"
fix = ["studies = [\"W2\"]\nextra = 1\n", "studies = [\"W2\"]\n"]
text = "tests/planted/case-unknown-field.toml:extra: unknown field\n  Next: remove extra, or check its spelling against the schema"

[[plant]]
file = "case-missing-field.toml"
fix = ["", "family = \"2D 3-state Potts, square lattice\"\n"]
text = "tests/planted/case-missing-field.toml:family: missing required field\n  Next: add family = ... to tests/planted/case-missing-field.toml"

[[plant]]
file = "case-bad-schema.toml"
fix = ["schema = 2", "schema = 1"]
text = "tests/planted/case-bad-schema.toml: schema 2 not supported for kind case (supported: 1)\n  Next: set schema = 1"

[[plant]]
file = "case-class-not-in-alphabet.toml"
fix = ["class_truth = \"CRITICAL\"", "class_truth = \"POINT\""]
text = "tests/planted/case-class-not-in-alphabet.toml:class_truth: 'CRITICAL' is not in ['POINT', 'LINE', 'WALKING', 'FIRST-ORDER', 'MULTI', 'BKT-END', 'NOT']\n  Next: use one of: POINT LINE WALKING FIRST-ORDER MULTI BKT-END NOT"

[[plant]]
file = "case-decoy-no-nondecoy.toml"
drop = ["cases/bc-tricritical.toml"]      # the catalogue import gave MULTI its own case: judge without it
fix = ["decoy_of = \"MULTI\"", "decoy_of = \"none\""]
text = "tests/planted/case-decoy-no-nondecoy.toml:decoy_of: no non-decoy case has class MULTI\n  Next: add a case of class MULTI, or set decoy_of = \"none\""

[[plant]]
file = "case-todo-left.toml"
fix = ["family = \"TODO\"", "family = \"2D 3-state Potts, square lattice\""]
text = "tests/planted/case-todo-left.toml:family: still TODO\n  Next: replace it with a short description of the model"

[[plant]]
file = "points-unknown-case.toml"
fix = ["\"4\" = \"potts-4\"", "\"4\" = \"none\""]
text = "tests/planted/points-unknown-case.toml:points.\"4\": unknown case 'potts-4'\n  Next: create it with bin/cc new case potts-4, or map the point to an existing case or \"none\""

[[plant]]
file = "points-missing-point.toml"
fix = ["", "\"5\" = \"potts-q5\"\n"]
text = "tests/planted/points-missing-point.toml:points.\"5\": point is not joined\n  Next: add \"5\" = <case id or \"none\"> to [points]"

[[plant]]
file = "input-unknown-instrument.toml"
fix = ["instruments = [\"two_start\", \"nosuch\"]", "instruments = [\"two_start\"]"]
text = "tests/planted/input-unknown-instrument.toml:instruments: 'nosuch' is not in the instrument registry\n  Next: use one of: across across_delta along fluct needle needle_chain needle_o stability stability_delta transform two_start"

[[plant]]
file = "input-eps-missing.toml"
fix = ["", "two_start = 0.02\n"]
text = "tests/planted/input-eps-missing.toml:eps.two_start: eps key missing (a declared instrument's column reads it)\n  Next: add two_start = <margin> to [eps]"

[[plant]]
