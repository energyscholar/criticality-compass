text = "tests/planted/codes-foreign-value.toml:columns.signature.a.map.\"POS\": 'Z' is not in the alphabet ['X', 'Y']\n  Next: use one of: X Y"

[[plant]]
file = "verdict-uncovered.toml"
fix = ["", "\n[[row]]\nwhen.a = [\"Y\"]\nwhen.b = [\"NOT-MEASURED\", \"NOT-EVALUATED\"]\nverdict = \"REFUSE-X\"\nwhy = \"planted: a Y and b null\"\n"]
over = { codes = "codes-mini.toml" }
text = "tests/planted/verdict-uncovered.toml: 2 uncovered cells in 1 patterns\n  [[row]]\n  when.a = [\"Y\"]\n  when.b = [\"NOT-MEASURED\", \"NOT-EVALUATED\"]\n  Next: add a [[row]] with one of these when-lines, or widen a neighbouring row"

[[plant]]
file = "verdict-overlap.toml"
fix = ["when.b = [\"Q\", \"P\"]", "when.b = [\"Q\"]"]
over = { codes = "codes-mini.toml" }
text = "tests/planted/verdict-overlap.toml: rows at lines 14 and 20 overlap on 1 cells, first: {'a': 'Y', 'b': 'P'}\n  Next: narrow one of the two rows so they share no cell"

[[plant]]
file = "verdict-unread-column.toml"
fix = ["when.a = [\"Y\"]\nverdict = \"REFUSE-X\"\nwhy = \"planted: a Y\"\n", "when.a = [\"Y\"]\nwhen.b = [\"P\"]\nverdict = \"REFUSE-X\"\nwhy = \"planted: a Y and b P\"\n\n[[row]]\nwhen.a = [\"Y\"]\nwhen.b = [\"Q\"]\nverdict = \"NOT\"\nwhy = \"planted: a Y and b Q\"\n\n[[row]]\nwhen.a = [\"Y\"]\nwhen.b = [\"NOT-MEASURED\", \"NOT-EVALUATED\"]\nverdict = \"REFUSE-X\"\nwhy = \"planted: a Y and b null\"\n"]
over = { codes = "codes-mini.toml" }
text = "tests/planted/verdict-unread-column.toml:columns: column 'b' is neither read by a row nor in ignores\n  Next: read it in a row or add it to ignores"

[[plant]]
