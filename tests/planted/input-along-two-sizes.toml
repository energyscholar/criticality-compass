# THIS IS CC's m.toml (planted test input: the along instrument on two sizes)
# It is NOT the toolset's m.toml.
schema = 1
kind = "input"
id = "p-along"
instruments = ["along"]

[obtained]
"0.0" = "navigated"
"1.0" = "navigated"

[axes]
point = ["0.0", "1.0"]
size = [27, 81]
starts = ["random"]
main_start = "random"

[observable]
name = "planted"
definition = "planted"
levels = [2, 3]
final_size = 9

[block_map]
name = "sign3-vacant"
factor = 3
keeps = "planted"
discards = "planted"

[relations.size]
template = "chain"
axis = "size"
provenance = "Coupling"
direction_from = "planted"

[relations.control]
template = "chain"
axis = "point"
provenance = "Coupling"
direction_from = "planted"

[interval]
method = "block"
b = 400
resamples = 400
level = 0.95
seed = 77

[eps]
y = 0.25

[kernel]
uses = ["A", "B"]

[data]
format = "npz-v1"

[[data.files]]
point = "0.0"
size = 27
start = "random"
path = "c1/d0.0-L27.npz"
arrays.G = { key = "G", level = 1 }

[[data.files]]
point = "0.0"
size = 81
start = "random"
path = "c1/d0.0-L81.npz"
arrays.G = { key = "G", level = 2 }

[[data.files]]
point = "1.0"
size = 27
start = "random"
path = "c1/d1.0-L27.npz"
arrays.G = { key = "G", level = 1 }

[[data.files]]
point = "1.0"
size = 81
start = "random"
path = "c1/d1.0-L81.npz"
arrays.G = { key = "G", level = 2 }
