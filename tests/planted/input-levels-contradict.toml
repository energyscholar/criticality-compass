# THIS IS CC's m.toml (planted test input: one B7 point, two sizes; observable.levels contradicts the stored stack)
# It is NOT the toolset's m.toml.
schema = 1
kind = "input"
id = "p-levels"
instruments = ["across"]

[obtained]
"0.0" = "truth"

[axes]
point = ["0.0"]
size = [27, 81]
starts = ["random"]
main_start = "random"

[observable]
name = "planted"
definition = "planted"
levels = [2, 2]
final_size = 9

[block_map]
name = "majority3"
factor = 3
keeps = "planted"
discards = "planted"

[relations.size]
template = "chain"
axis = "size"
provenance = "Coupling"
direction_from = "planted"

[conjugate]
observable = "E"
conjugate_to = "K"
hamiltonian_knowledge = true

[interval]
method = "block"
b = 100
resamples = 400
level = 0.95
seed = 1

[eps]
y = 0.25

[kernel]
uses = ["A"]

[data]
format = "npz-v1"

[[data.files]]
point = "0.0"
size = 27
start = "random"
path = "b7/L4-0.0000-L27.npz"
arrays.G = { key = "Gp", level = 1 }
arrays.E = { key = "E2" }

[[data.files]]
point = "0.0"
size = 81
start = "random"
path = "b7/L4-0.0000-L81.npz"
arrays.G = { key = "Gp", level = 1 }
arrays.E = { key = "E2" }
