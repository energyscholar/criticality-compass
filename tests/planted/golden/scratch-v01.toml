when.two_start = ["INDEP", "UNRES"]
when.flow = ["STOPPED"]
when.across = ["RELEVANT", "MARGINAL"]
when.stability = ["NOT-MEASURED", "NOT-EVALUATED"]
verdict = "REFUSE-STABILITY-UNMEASURED"
why = "honest null: stability was not measured or not evaluated"
