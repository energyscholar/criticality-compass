# tests/golden/golden.toml - the GOLDEN TRANSCRIPTS (data; read by tests/test_golden.py).
# Each [[case]] runs `bin/cc <argv>` in a fresh temp copy of the repo (data read in place), once
# per mode (basic: argv as written; advanced: argv + ["--advanced"]), after its `before` commands
# (not recorded) and its `plant` copies (src -> dst inside the copy). The transcript is
# tests/golden/<id>.<mode>.txt: "$ bin/cc <argv>", then stdout and stderr, then "exit <code>".
schema = 1
kind = "golden"

[[case]]
id = "help"
argv = ["help"]
phase = 4

[[case]]
id = "show-b7"
argv = ["show", "b7-at-line"]
phase = 4

[[case]]
id = "show-w2"
argv = ["show", "w2-potts"]
phase = 4

[[case]]
id = "explain-w2-5"
argv = ["explain", "w2-potts", "5"]
phase = 4

[[case]]
id = "explain-b7-0.07"
argv = ["explain", "b7-at-line", "0.07"]
phase = 4

[[case]]
id = "explain-x8-1.10"
argv = ["explain", "x8-ising-needle", "1.10"]
phase = 4

[[case]]
id = "run-dry-x8"
argv = ["run", "x8-ising-needle", "--dry"]
phase = 4

[[case]]
id = "tables-fork"
argv = ["tables", "fork", "verdict-x-rules", "g1"]
phase = 4

[[case]]
id = "tables-drop"
before = [["tables", "fork", "verdict-x-rules", "g1"]]
argv = ["tables", "drop", "g1"]
phase = 4

[[case]]
id = "tables-drop-default"           # the default check runs before the frozen check, so this
argv = ["tables", "drop", "v01-rules"]   # the default set (plan 0864 R10b: was verdict-x-rules)
phase = 4

[[case]]
id = "validate-refusals"
before = [["tables", "fork", "verdict-x-rules", "golden-bad"]]
argv = ["validate"]
phase = 4

[case.plant]                          # src (under tests/planted/golden/) -> dst in the copy
"join-unknown-case.toml" = "inputs/w2-potts/points.toml"
"uncovered-verdict.toml" = "tables/golden-bad/verdict.toml"
"todo-case.toml" = "cases/golden-todo.toml"

# ---- phase 5: every command a doc shows ---------------------------------------------------
# A `before` command runs BEFORE the plants, so a case that must run after an edit plants the
# edited file and runs the command itself.

[[case]]
id = "new-case"
argv = ["new", "case", "potts-q4"]
phase = 5

[[case]]
id = "tables-fork-my-rules"
argv = ["tables", "fork", "verdict-x-rules", "my-rules"]
phase = 5

[[case]]
id = "validate-my-rules"
before = [["tables", "fork", "verdict-x-rules", "my-rules"]]
argv = ["validate"]
phase = 5

[case.plant]
"my-rules-edit.toml" = "tables/my-rules/verdict.toml"

[[case]]
id = "run-dry-my-rules"
before = [["tables", "fork", "verdict-x-rules", "my-rules"]]
argv = ["run", "w2-potts", "--tables", "my-rules", "--dry"]
phase = 5

[case.plant]
"my-rules-edit.toml" = "tables/my-rules/verdict.toml"

[[case]]
id = "tables-drop-my-rules"
before = [["tables", "fork", "verdict-x-rules", "my-rules"]]
argv = ["tables", "drop", "my-rules"]
phase = 5

[[case]]
id = "tables-fork-scratch"
argv = ["tables", "fork", "verdict-x-rules", "scratch"]
phase = 5

[[case]]
id = "validate-scratch-half"
before = [["tables", "fork", "verdict-x-rules", "scratch"]]
argv = ["validate"]
phase = 5

[case.plant]
"scratch-half.toml" = "tables/scratch/verdict.toml"

[[case]]
id = "validate-scratch"
before = [["tables", "fork", "verdict-x-rules", "scratch"]]
argv = ["validate"]
phase = 5

[case.plant]
"scratch-d13.toml" = "tables/scratch/verdict.toml"

[[case]]
id = "run-all-scratch"
before = [["tables", "fork", "verdict-x-rules", "scratch"]]
argv = ["run", "--all", "--tables", "scratch"]
phase = 5

[case.plant]
"scratch-d13.toml" = "tables/scratch/verdict.toml"

[[case]]
id = "tabulate-diff-scratch"      # no scratch results here: a run before the plant would be stale
before = [["tables", "fork", "verdict-x-rules", "scratch"]]
argv = ["tabulate", "--diff", "verdict-x-rules", "scratch"]
phase = 5

[case.plant]
"scratch-d13.toml" = "tables/scratch/verdict.toml"

[[case]]
id = "tables-drop-scratch"
before = [["tables", "fork", "verdict-x-rules", "scratch"], ["run", "--all", "--tables", "scratch"]]
argv = ["tables", "drop", "scratch", "--with-results"]
phase = 5

[[case]]
id = "tables-split"
before = [["tables", "fork", "verdict-x-rules", "mine"]]
argv = ["tables", "split", "mine", "--column", "two_start", "--value", "UNRES", "--verdict", "REFUSE-EQUIL"]
phase = 5

[[case]]
id = "new-input-like"
argv = ["new", "input", "w2b", "--like", "w2-potts", "--points", "6,7"]
phase = 5

[[case]]
id = "data-add-pinned"
argv = ["data", "add", "w2-potts"]
phase = 5

[[case]]
id = "freeze-frozen"
argv = ["freeze", "w2-potts@verdict-x-rules"]
phase = 5

[[case]]
id = "run-frozen"
argv = ["run", "w2-potts", "--tables", "verdict-x-rules"]
phase = 5

[[case]]
id = "tabulate"
argv = ["tabulate"]
phase = 5

[[case]]
id = "validate-mvt"
argv = ["validate", "--mvt"]
phase = 5

[[case]]
id = "explain-x4"
argv = ["explain", "x4-ising-field", "0.5"]
phase = 5

[[case]]
id = "show-x2"
argv = ["show", "x2-xy-line"]
phase = 5

# ---- phase 6 (plan 0864): every command the v0.1 docs show -----------------------------------
# The v0.1 docs fork from the DEFAULT set (v01-rules); the cases above fork verdict-x-rules and stay as they were.

[[case]]
id = "family-b7-2"
argv = ["family", "b7-at-line-2"]
phase = 6

[[case]]
id = "family-x7a-bc-lambda"
argv = ["family", "x7a-bc-lambda"]
phase = 6

[[case]]
id = "show-b7-2"
argv = ["show", "b7-at-line-2"]
phase = 6

[[case]]
id = "explain-pair-b7-2"
argv = ["explain", "b7-at-line-2", "0.14->0.21"]
phase = 6

[[case]]
id = "explain-pair-x7a-bc"
argv = ["explain", "x7a-bc", "1.0->1.5"]
phase = 6

[[case]]
id = "validate-no-membership"          # F1: the refusal names the copy to make and the fork
before = [["tables", "fork", "verdict-x-rules", "nomem"]]
argv = ["validate", "--input", "b7-at-line-2", "--tables", "nomem"]
phase = 6

[[case]]
id = "reverdict-w2"
before = [["tables", "fork", "v01-rules", "rv"]]
argv = ["reverdict", "w2-potts", "--tables", "rv"]
phase = 6

[case.plant]
"my-rules-v01-edit.toml" = "tables/rv/verdict.toml"

[[case]]
id = "reverdict-refused"
before = [["tables", "fork", "v01-rules", "rv"]]
argv = ["reverdict", "b7-at-line-2", "--tables", "rv"]
phase = 6

[case.plant]
"membership-dis-on.toml" = "tables/rv/membership.toml"

[[case]]
id = "new-family"
argv = ["new", "family", "b7-demo"]
phase = 6

[[case]]
id = "new-instrument"
argv = ["new", "instrument", "foo"]
phase = 6

[[case]]
id = "new-input-add-instrument"
argv = ["new", "input", "b7c", "--like", "b7-at-line", "--add-instrument", "along"]
phase = 6

[[case]]
id = "tables-fork-v01-my-rules"
argv = ["tables", "fork", "v01-rules", "my-rules"]
phase = 6

[[case]]
id = "run-dry-v01-my-rules"
before = [["tables", "fork", "v01-rules", "my-rules"]]
argv = ["run", "w2-potts", "--tables", "my-rules", "--dry"]
phase = 6

[case.plant]
"my-rules-v01-edit.toml" = "tables/my-rules/verdict.toml"

[[case]]
id = "tables-fork-v01-scratch"
argv = ["tables", "fork", "v01-rules", "scratch"]
phase = 6

[[case]]
id = "validate-v01-scratch-half"
before = [["tables", "fork", "v01-rules", "scratch"]]
argv = ["validate"]
phase = 6

[case.plant]
"scratch-half-v01.toml" = "tables/scratch/verdict.toml"

[[case]]
id = "validate-v01-scratch"
before = [["tables", "fork", "v01-rules", "scratch"]]
argv = ["validate"]
phase = 6

[case.plant]
"scratch-v01.toml" = "tables/scratch/verdict.toml"

[[case]]
id = "run-all-v01-scratch"
before = [["tables", "fork", "v01-rules", "scratch"]]
argv = ["run", "--all", "--tables", "scratch"]
phase = 6

[case.plant]
"scratch-v01.toml" = "tables/scratch/verdict.toml"

[[case]]
id = "tabulate-diff-v01-scratch"
before = [["tables", "fork", "v01-rules", "scratch"]]
argv = ["tabulate", "--diff", "v01-rules", "scratch"]
phase = 6

[case.plant]
"scratch-v01.toml" = "tables/scratch/verdict.toml"

[[case]]
id = "tables-drop-v01-scratch"
before = [["tables", "fork", "v01-rules", "scratch"], ["run", "--all", "--tables", "scratch"]]
argv = ["tables", "drop", "scratch", "--with-results"]
phase = 6

[[case]]
id = "tables-split-v01"
before = [["tables", "fork", "v01-rules", "mine"]]
argv = ["tables", "split", "mine", "--column", "two_start", "--value", "UNRES", "--verdict", "REFUSE-EQUIL"]
phase = 6

[[case]]
id = "tabulate-diff-v01-vs-x"          # the v01-rules change, as the docs quote it (plan 0864 Q1 c' + Q2)
argv = ["tabulate", "--diff", "verdict-x-rules", "v01-rules"]
phase = 6

[[case]]
id = "mutate-breakers"
argv = ["mutate", "tables/verdict-x-rules/codes.toml", "--sed", "s/\"SIG+\" = \"COEXIST\"/\"SIG+\" = \"INDEP\"/", "--", "test_breakers"]
phase = 6
