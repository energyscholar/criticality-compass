[[change]]
date = "2026-10-02"
points = ["*"]
why = """DECLARED BEFORE THE FIRST RUN under v02-rules (plan 0866 P-A, G6). v02-rules = v01-rules + geometry.toml + \
order.toml + compose.toml; verdict.toml is byte-identical. Every verdict above is the v01-rules lock carried over, so the \
expected effect is NONE: 0 cells and 0 fixture points change in tabulate --diff v01-rules v02-rules. [order.*] is \
predicted from the stored v01-rules sign codes (needle, two_start) by hand, not from a v02-rules run: DIS/ORD is \
OFF-WINDOW, an unmeasured needle NEEDLE-UNMEASURED, MID with COEXIST COEXIST-AT-WINDOW, MID with FLUCT/UNRES \
NOT-EQUILIBRATED, MID with INDEP EQUILIBRATED, MID with an unmeasured two_start ORDER-UNMEASURED. A moved verdict is a \
finding, never an edit of this file"""
