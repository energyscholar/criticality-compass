x4-ising-field-2, x5-bilayer-2 and b7-at-line-3 are copies of the inputs that have E, with the fluct instrument added \
(the frozen inputs cannot change); same blocks, seed and resample draws, so every combined verdict is the one the original \
gets and every [verdicts.*] line above is that original's. [fluct.*] is the FLUCT REPLAY LOCK on the code of fluct.y_last (A over \
ln var(e), 81 -> 243): w2 q = 2, 3, 4 VANISHES (a continuous transition: the variance per bond falls with size), q = 5 \
VANISHES or UNRES and NEVER PERSISTS (the pre-registered blind spot: xi >> L); the other inputs never PERSISTS (their \
points are continuous or off-critical; x4, a first-order line, is not locked). [order.*] of a point the starts leave \
EQUILIBRATED is CONTINUOUS or EQUILIBRATED-UNRES, never FIRST-ORDER-TUNNELLING. No combined point verdict moves"""

