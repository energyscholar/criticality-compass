[[change]]
date = "2026-10-02"
points = ["x4-ising-field-3:*"]
why = """magnetisation two-start demo (0866 Q5). DECLARED BEFORE THE RUN. x4-ising-field-3 = x4-ising-field with two_start reading Q = O column 1 (the magnetisation per site) instead of the energy. The needle still reads ORD at all three points, so geometry is NOT and order OFF-WINDOW (the needle's position rule, not a side table): the combined verdict stays NOT, the class x4-ising-field already had. [two_start.*] is the code as observed in the dry run (seen before this lock): FLUCT at every point. FINDING, not repaired: D = M(random start) - M(ordered start) is negative because the frozen PLUS (random role) and MINUS (ordered role) files sit in opposite phases (+0.81 and -0.81); the sign of D for a signed order parameter is set by which start is called ordered, and two_start's sign cut reads it as an energy-like quantity. The starts DO stay apart (|D| = 1.6) - a COEXIST in physics that the sign convention reads as FLUCT. order never reads it here (OFF-WINDOW gate first)"""

[[change]]
date = "2026-10-02"
points = ["x5n-bilayer:*"]
why = """DECLARED BEFORE THE REAL RUN of x5n-bilayer (plan 0865 S3). 0865 confirmed stop: X5 3/3 (toolset results/X5n.txt): POINT at all three g (needle MID, flow STOPPED, across RELEVANT, stability STABLE, two_start INDEP), the verdict read on the very data the stop was confirmed on (N 32000, block 1600). The truth is POINT (coupled-ising-bilinear, class POINT); the lock is CC's expected verdict, not truth. Order is CONTINUOUS and fluct VANISHES (the Ising class: the energy variance per bond falls with size), predicted from the toolset cells (needle MID, STOPPED, two_start INDEP). A different verdict is a finding, never an edit of this file. (A --dry run was seen before this file was written: it reads POINT at every g under all three sets, as the toolset does.)"""
