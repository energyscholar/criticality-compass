# written 2026-10-11 17:22 PDT BEFORE any v10 run of k4-m1 exists (git order is the proof). Written for the independent review.
# PATH: not expected/v10-rules-k4m1.toml - tests/test_scoreboard.py globs expected/*.toml, needs tables == file stem and a [verdicts] table,
#       and detect.load_tables("v10-rules-k4m1") raises (no such set) => bin/cc check would go red. This subdirectory is not globbed.
#
# INPUTS (the only ones): results/k4-m1@v08-rules.json (sha256 36a2d2fc01a7596d..., block b 400, R 400) at release-1-0 7f8842f;
#   toolset m.toml @39cb497 [0937] m 10 r 2 and [0937.diff] prediction_basis; tables/v08-rules (v10-rules = v08-rules + interval.toml only, diff -rq).
#   Calibration read: toolset results/0937-P4-diff-t2a.txt (8/59 verdicts moved in batch A, both directions, mostly via needle.velocity / across cells).
#
# PREDICTION RULE (fixed before it was applied; applied once, mechanically, no tuning):
#   For every v08 reading entry with a finite [lo, hi] (point readings and each pair/size entry): s = (hi - lo) / 3.45, the chain-reading sd implied
#   by [0937.diff] (block width ~ 2 x 1.96 x 0.88 sd). Model the v10 interval as [c - 1.0015 s, c + 1.0015 s] (E[X_(9) - X_(2)] = 2.003 sd at m 10,
#   r 2) with centre c ~ N(est, (1.067 s)^2) (old est = one chain; new centre = median of 10 chains, var factor 1 + 0.138). New cell = cc/sign.cell
#   against that reading's eps; entries without a finite interval keep their v08 cell; entries drawn independently. New verdict = CC's own
#   detect.verdict_of(signature_from_cells(...)) on tables v08-rules. 4000 draws per point, numpy default_rng(937006).
#   FLIP PREDICTED iff P(new verdict != v08 verdict) > 0.5; direction = the modal new verdict.
# KNOWN WEAKNESS: s comes from the block interval, which UNDER-covers (0930 ARM M 0.79-0.94; batch A x2 pt 0.6 showed a block interval far too
#   narrow) => chain spread is likely underestimated, so P(flip) here is a lower bound; independence across cells ignores shared chains.
#
# RESULT: 17 points, 1 flip predicted (0.40 REFUSE-SLOW -> NOT, refuse -> confident), 16 no flip. Two further points carry a small P (0.45, 0.90).

