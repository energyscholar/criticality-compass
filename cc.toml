# cc.toml - Criticality Compass configuration (plumbing reads it; every field required)
schema = 1
kind = "cc"

[defaults]
tables = "v01-rules"          # the working table set (a directory under tables/)
mode = "basic"                  # basic | advanced; the flag --advanced overrides per command

[data]
name = "<data-root>"   # the NAME every stored data path starts with (a result's `read` map); never a location. Where the data IS on this machine: --data-root PATH, else CC_DATA_ROOT, else the clone's data/. Every m.toml path is relative to it, except a path whose first directory is named in `local`
local = ["l8"]   # plan 0884 amendment 6 F1: data that lives IN this repo under data/ (CC0, redistributable; data/l8/ATTRIBUTION.md), so no gate reads outside the repo for it

[sources]
roots = ["<library>", "<toolset>"]   # a case's `sources` entry is a NAME <root>/path under one of these (a citation into the author's reading library or toolset); the entry's shape is checked, never a location on this machine

[alphabets]
class_truth = ["POINT", "LINE", "WALKING", "FIRST-ORDER", "MULTI", "BKT-END", "NOT"]
order_truth = ["CONTINUOUS", "FIRST-ORDER", "NONE"]   # a case's true order of the transition (cases/*.toml order_truth)
status = ["declared", "sampler-tested", "run", "in-signature-table"]    # ordered
obtained = ["truth", "navigated", "observed"]   # how a point was obtained (m.toml [obtained])
interior_rule = ["mid-run-open"]   # a family's `interior` as a declared rule (plan 0879): the MID run of the needle codes, open at a sink side
formats = ["npz-v1", "npy-v1", "snapshots-v1", "image-stack-v1", "island-table-v1"]
window_origin = ["extent-min"]   # [windows] origin of an input (plan 0884): the window starts at the file's own minimum row and column; cc/windows.py ORIGINS holds one offset per name (a total table)
limited = ["none", "assigned", "resolution-limited"]   # [block_map] limited: what the finest level is (plan 0873): a value that is not a measured site
replay = ["locked", "all"]   # [check] replay (plan 0886): `locked` replays the inputs expected/<set>.toml names; `all` replays every input on disk
interval_method = ["block", "iid", "gamma", "chains"]   # [interval] method of an input's m.toml (plan 0883: was a tuple in declare.py; plan 0878 adds "gamma"); each has a [interval_fields.<method>] table below
registry_status = ["registered", "registered-partial", "registered-synthetic-only", "built-not-registered", "non-identifiable", "superseded", "unbuilt", "future", "development"]   # plan 1016: the status alphabet of registry.toml; [registry.table] is total over it (and over alphabets.obtained + any)
nulls = ["NOT-MEASURED", "NOT-EVALUATED"]       # the honest nulls, in rank order; never map keys

# [levels]: the z of each declared interval level (plan 0878). A method whose [interval_fields.<method>] names level_in = "levels" refuses any level that is not a key here; no scipy.
[levels]
"0.95" = 1.959964

# [interval_fields.<method>] (plan 0878): the fields of an input's [interval] for each method of alphabets.interval_method, as DATA (validate reads it; there is no if-ladder per method).
# required / optional: field -> type name (str | int | num). A field in neither is refused as unknown for that method. min_blocks (block only) is the floor on n // b per declared file.
# show / read / read_pair: the words `show --advanced` and `explain` print for the method ({field} is read from the result's interval block; view.py holds no per-method text).
# plan 0937: interval_binding.default = the methods a table set reads when it has no tables/<set>/interval.toml (v10-rules has one: ["chains"]).
# chained = does an input of the method label every [[data.files]] block with its chain (method chains: m independent chains per cell, T18-B order statistics).
[interval_binding]
default = ["block", "iid", "gamma"]

[interval_fields.block]
chained = false
required = { method = "str", resamples = "int", level = "num", seed = "int", b = "int" }
optional = { tau_declared = "int", min_blocks = "int" }
show = "resamples {resamples}, level {level}, seed {seed}"
read = "{resamples} {method} resamples, b {b}"
read_pair = "{resamples} {method} resamples"

[interval_fields.iid]
chained = false
required = { method = "str", resamples = "int", level = "num", seed = "int", tau_declared = "int" }
optional = { b = "int" }
show = "resamples {resamples}, level {level}, seed {seed}"
read = "{resamples} {method} resamples"
read_pair = "{resamples} {method} resamples"

[interval_fields.gamma]
chained = false
required = { method = "str", level = "num", window_s = "num", window_max = "int", door_z = "num", tau_declared = "int", tau_source = "str" }
optional = {}
level_in = "levels"
k_gamma = 64          # plan 0891: the floor n >= k_gamma * tau_declared on every declared array. DERIVED, not chosen: the smallest n/tau at which the nominal-95 % Gamma interval covers >= 0.90 at every tau in {2, 7, 30, 100, 250} (toolset results/0891.txt, 2000 AR(1) series per cell). tau_declared is the INPUT's declared tau, never Gamma's own estimate (that is biased low on a short series)
diff_step = 0.001     # the finite-difference step of the linearisation rows, as a fraction of each primary's naive SE (a stage may be nonlinear, e.g. ln: the step must stay small against the quantity)
show = "window_s {window_s}, window_max {window_max}, door_z {door_z}, level {level}"
read = "{method}, window_s {window_s}, window_max {window_max}"
read_pair = "{method}, window_s {window_s}, window_max {window_max}"

# plan 0937 / toolset m.toml [0937]: m independent chains per (point, size, start) cell, the interval [v_(r), v_(m+1-r)] of the m per-chain readings, r = rank(m, alpha)
# (m 10, r 2, alpha 22/1024 => coverage 1 - alpha = 0.978515625); no resamples, level or seed. The estimate is the median of the m readings (reported, never in the sign cell).
[interval_fields.chains]
chained = true
required = { method = "str", m = "int", r = "int", alpha = "num", chain_root = "str" }
optional = {}
show = "m {m} chains, r {r}, alpha {alpha}, chain_root {chain_root}"
read = "{m} chains, order statistics r {r}"
read_pair = "{m} chains, order statistics r {r}"

# A STACK format is raw frames the door reduces itself (cc/reduce.py) through the input's declared [block_map] and [observable]: the
# schema is DATA here (cc/formats.py holds no per-format code). reduces = the array kinds computed from the stack; dims/dtypes = the raw
# stack s[N, L, L]; readers = one importable module per file extension (a module that is absent is a refusal with a Next line, never a skip).
[formats.snapshots-v1]
reduces = ["G", "GL"]
dims = 3
dtypes = ["int8", "int16", "int32", "int64"]
readers = { ".npy" = "numpy", ".npz" = "numpy" }

[formats.image-stack-v1]
reduces = ["G", "GL"]
dims = 3
dtypes = ["uint8"]
readers = { ".npy" = "numpy", ".tif" = "tifffile", ".tiff" = "tifffile" }

# plan 0884: a table of islands, one row per island: row, col, then one +-1 moment per frame; (row, col) is the island's grid index and a site that is not listed is VACANT.
# The reader builds s[frames, H, W] with H, W the file's own extents; `values` are the only moments a row may hold, `vacant` fills every unlisted site.
[formats.island-table-v1]
reduces = ["G", "GL"]
dims = 3
dtypes = ["int8"]
readers = { ".csv" = "csv" }
vacant = 0
values = [-1, 1]

# The transducer file inputs/<id>/transducer.toml (plan 0883; Q0): the sentences it must carry are DATA here, compared by equality.
[transducer]
kinds = ["transducer", "record"]
phase1_output = "one configuration per recorded sweep; each configuration is one observation; the recorded sequence is NOT a process sequence (Phase 1 only)"
phase2_output = "one frame per recorded time; the recorded sequence IS a declared process sequence (Phase 2; real transient record only)"
interval_role = "projection C: places the reading's sign cell against its declared margin; never an operator input"

[flags]                         # flag code -> the words every output prints (never the bare code)
T = "truth point"
N = "navigated point"
C = "observed point"
H = "uses Hamiltonian knowledge"
U = "membership unchecked (the upstream needle was not measured)"

[obtained_flag]                 # m.toml [obtained] value -> flag code
truth = "T"
navigated = "N"
observed = "C"

[arrays]                        # array kind -> dimensions after the declared level selection
G = 1                           # the observable at final size, one value per snapshot
GL = 2                          # the observable's full level stack [N, levels]
E = 1                           # the conjugate (energy) per snapshot
Q = 1                           # the two-start order parameter per snapshot

[conventional]                  # plan 0881 P2.3 (an external verifier (ruling Q3), 2026-10-05): an instrument whose output show/explain print WITH this label and no verdict row after v07 may read: no observation exists at infinite size, and the shared-omega assumption is an undeclared prior
transform = "independent conventional estimate — not a Compass reading"

[report]                        # plans 0892/0893 (an external verifier (ruling Q19), 2026-10-06): what a printed verdict IS. show prints `verdict` once under each result header; family.show prints `family` under its `=>` line; SIGNATURE-TABLE.md prints both
family = "declared report — a projection C over per-point sign cells, not a relational reading (an external verifier (ruling Q19), 2026-10-06)"
verdict = "declared report — a projection C over sign cells of declared comparisons (the blocking-map comparison of independent sizes; the two-start difference), not a relational reading (an external verifier, 2026-10-06)"

# [step_labels] (plan 0893 P1): the word `explain` prints at step 3 for each relation NAME an instrument declares; step 4 prints the distinct
# [step_labels.operator] words of the instrument's relations, in declared order, joined by "+". validate: every relation name of instruments/*.toml has an entry,
# and every entry is a key of [step_labels.operator].
[step_labels]
size = "COMPARISON"
matched = "COMPARISON"
chain = "COMPARISON"
start = "COMPARISON"            # pending an external verifier (ruling R1)
control = "RELATION"            # pending an external verifier (ruling R2)

[step_labels.operator]
COMPARISON = "C"
RELATION = "KERNEL"

# [projections.<name>] (plans 0892/0893): what each declared projection C keeps and discards. validate requires both strings non-empty for
# `family` and for every relation name whose step label is COMPARISON.
[projections.family]
keeps = "the interior sign-cell run; the ordered differences, inside C, of the stored per-point readings over it (the needle codes' ranks; across_delta.y_last per stored row: per resample under block and iid, per chain under chains, rows 1..m); the stored along cells"
discards = "every point outside the run; every magnitude beyond its sign cell; every other column; joint coverage over the cells a family code reads"

[projections.size]
keeps = "the ordered difference, inside C, of per-locus observations of independent sizes through the declared blocking map (one blocking step relates L to L/3)"
discards = "every provenance claim: the comparison is analysis-supplied, not Coupling, not Continuation, not Persistence"

[projections.matched]
keeps = "the ordered differences, inside C, along the declared matched pair of blocking-map comparisons (the big size at level k against the small size at level k-1)"
discards = "every provenance claim: the comparison is analysis-supplied, not Coupling, not Continuation, not Persistence"

[projections.chain]
keeps = "the ordered differences, inside C, along the declared matched-chain of blocking-map comparisons"
discards = "every provenance claim: the comparison is analysis-supplied, not Coupling, not Continuation, not Persistence"

[projections.start]
keeps = "the difference, inside C, of the two declared starts' observations at one point (pending an external verifier (ruling R1))"
discards = "every provenance claim: the comparison is analysis-supplied, not Coupling, not Continuation, not Persistence"

[basic]                         # BASIC is a DECLARED PROJECTION of the full result
keeps = ["point", "column", "estimate", "lo", "hi", "cell", "code", "reason", "verdict", "why", "pairs", "geometry", "order"]
discards = [
  "instrument", "unit", "eps_key", "eps", "flags", "obtained", "vector_key",
  "verdict_class", "row_line", "per_size", "read", "code_commit", "code_hash", "measure_hash", "peak_rss_mb", "interval", "reports", "derived_from",
  "pair_readings", "axis_lines", "declared",
]
blank = ["NOT-MEASURED", "NOT-EVALUATED", "UNRES"]  # shown as BLANK (<value>: <reason>)
blank_refuse = true             # a verdict in the set's `refuse` list shows as BLANK (<verdict>)
commands = ["show", "explain", "run", "new case", "tables fork", "tables drop", "validate", "check", "help"]

[check]                         # bin/cc check --fast (the pre-commit hook) skips the `slow` tests
memory_gb = 5.0                # this host's memory budget for measuring workers (6.3 GB installed); test_run_all's pool is sized from it and the recorded peaks (plan 0881)
replay = "locked"                # test_run_all replays the inputs the lock file names (an input is in the gate iff expected/<set>.toml names it)
exclusive = ["test_run_all"]    # these tests run ALONE after the parallel batch (test_run_all sizes its own worker pool from memory_gb)
needs_data = ["test_chains", "test_chains_declare", "test_v10_readable", "test_needle_x8", "test_b7", "test_two_start_c2", "test_reverdict", "test_family", "test_x5", "test_pool", "test_v08_result", "test_data_root"]   # plan 0929: these read the author's data root (7.6 GB) / toolset; measured by emptying both (a clean-install cell without the data runs the fast set minus these and needs_rust)
needs_rust = ["test_kernel_rs", "test_kernel_rs_bitwise"]   # plan 0929: these import kernel_rs (test_kernel_rs the committed cc/_ext .so, a linux ELF; test_kernel_rs_bitwise the INSTALLED wheel)
fast_budget_s = 30              # elapsed time is printed against it; over budget WARNS, never fails
slow = ["test_0978", "test_v10_readable", "test_chains_declare", "test_w2", "test_detect_verdicts", "test_breakers_red", "test_view", "test_golden", "test_along", "test_axes", "test_tables_cli", "test_tabulate", "test_needle_o_start", "test_run_all", "test_declare", "test_freeze_key", "test_code_hash", "test_chain", "test_across_delta", "test_end_note", "test_delta_basis", "test_reduce", "test_stack_door", "test_reuse", "test_probe", "test_transducer", "test_gamma_twin", "test_explain_pair", "test_check_summary", "test_conventional", "test_data_root", "test_report", "test_expect", "test_wheel"]   # each phase appends its > 5 s tests

# plan 0884 amendment 6 F2: the REFUSAL kinds an input's [expect] may absorb, as a total table of the field (the part of a finding's location after "m.toml:") each kind is reported at.
# Anything else under inputs/<id>/ (a missing file, a schema defect, a misspelt field) is a defect, not a refusal: it stays a finding whatever the sentence file says.
[refusal_fields]
reader = '^data\.files\[\d+\]\.arrays\.[^.]+$'   # a table the reader refuses (a moment the format does not admit)
block_floor = '^interval\.min_blocks$'   # an interval floor (block): n // b < min_blocks
gamma_floor = '^interval\.tau_declared$'   # an interval floor (gamma): k_gamma * tau_declared > n

[golden.classes.a]    # help text or a new command
files = ["help.*.txt", "new-*.txt"]
match = ['^[-+]\s+bin/cc ', '^[-+]wrote ', '^[-+]  Next: ']
[golden.classes.b]    # a count or a listing
files = ["*.txt"]
match = ['^[-+]dropped tables/\S+ and \d+ result files$', '^[-+]froze \d+ files, \d+ dir for ', '^[-+]validate: \d+ findings$',
         '^[-+]tabulate: \d+ results ', '^[-+]touched \d+ rows ', '^[-+]inputs: ', '^[-+]checked: ', '^[-+]rules in use: ']
[golden.classes.c]    # the code hash or commit a result records
files = ["*.txt"]
match = ['^[-+]\s+code_(commit|hash): ']
[golden.classes.d]    # the frozen flag
files = ["*.txt"]
match = ['\((not frozen|frozen)\)$']
[golden.classes.i]    # plan 0884 amendment 6 F6 (stated, not silent): the line validate prints for an input whose [expect] refusals matched their frozen sentence file exactly
files = ["*.txt"]
match = ['^[-+]\S+: refused as declared \(\d+ sentences\)$']
[golden.classes.f]    # plans 0892/0893 R4 (i): the report line inserted under a result header
files = ["*.txt"]
match = ['^\+report: declared report — ']
[golden.classes.g]    # plans 0892/0893 R4 (ii): explain's step-3/4 label words (cc.toml [step_labels]); the regolden's numbers are checked apart
files = ["explain-*.txt"]
match = ['^[-+]  [34] (RELATION|COMPARISON|KERNEL|C\+KERNEL|C) ']
[golden.classes.h]    # plans 0892/0893 R4 (iii): the family `=>` line and its label line
files = ["family-*.txt"]
match = ['^[-+]  => family (verdict|report) ', '^\+     report: declared report — ']

# plan 1016: the registry gate. registry.toml is a GENERATED projection of the toolset REGISTRY.toml (bin/cc registry pull <toolset-commit>); cc/registry.py is its one reader.
# The registry is a property of the RELEASE: it is in no result file. sha256 = the pin of registry.toml; a mismatch makes every unit read as a Refuse value.
[registry]
sha256 = "09538502a656b57227198e3a771b6d626fc83db4c53e5cb0ceba0b940a187107"

# [registry.units]: every unit this release can run -> its registry id (instrument.<name>, interval.<method>, family). A unit with no row reads as Refuse "mechanism not yet available".
[registry.units]
"instrument.needle" = "D-needle"
"instrument.needle_o" = "D-needle-o"
"instrument.needle_chain" = "D-needle-chain"
"instrument.across" = "D-across"
"instrument.across_delta" = "D-across-delta"
"instrument.along" = "D-along"
"instrument.stability" = "D-stability"
"instrument.stability_delta" = "D-stability-delta"
"instrument.two_start" = "D-two-start"
"instrument.fluct" = "D-fluct"
"instrument.transform" = "D-transform"
"instrument.report" = "D-report"
"interval.block" = "D-interval-block"
"interval.iid" = "D-interval-iid"
"interval.gamma" = "D-interval-gamma"
"interval.chains" = "D-interval-chains"
family = "D-family"

# [registry.table]: the TOTAL table "<status>/<obtained>" -> Run | RunScoped | Refuse: <reason>. "no-module" is the key of a row that names no release_module; "any" is a lookup with no input in hand.
[registry.table]
"registered/truth" = "Run"
"registered/navigated" = "Run"
"registered/observed" = "Run"
"registered/any" = "Run"
"registered-partial/truth" = "RunScoped"
"registered-partial/navigated" = "RunScoped"
"registered-partial/observed" = "RunScoped"
"registered-partial/any" = "RunScoped"
"registered-synthetic-only/truth" = "RunScoped"
"registered-synthetic-only/navigated" = "RunScoped"
"registered-synthetic-only/observed" = "Refuse: registered synthetic-only; not for observed data"
"registered-synthetic-only/any" = "RunScoped"
"built-not-registered/truth" = "Refuse: mechanism not yet available"
"built-not-registered/navigated" = "Refuse: mechanism not yet available"
"built-not-registered/observed" = "Refuse: mechanism not yet available"
"built-not-registered/any" = "Refuse: mechanism not yet available"
"non-identifiable/truth" = "Refuse: mechanism not yet available"
"non-identifiable/navigated" = "Refuse: mechanism not yet available"
"non-identifiable/observed" = "Refuse: mechanism not yet available"
"non-identifiable/any" = "Refuse: mechanism not yet available"
"superseded/truth" = "Refuse: mechanism not yet available"
"superseded/navigated" = "Refuse: mechanism not yet available"
"superseded/observed" = "Refuse: mechanism not yet available"
"superseded/any" = "Refuse: mechanism not yet available"
"unbuilt/truth" = "Refuse: mechanism not yet available"
"unbuilt/navigated" = "Refuse: mechanism not yet available"
"unbuilt/observed" = "Refuse: mechanism not yet available"
"unbuilt/any" = "Refuse: mechanism not yet available"
"future/truth" = "Refuse: mechanism not yet available"
"future/navigated" = "Refuse: mechanism not yet available"
"future/observed" = "Refuse: mechanism not yet available"
"future/any" = "Refuse: mechanism not yet available"
"development/truth" = "RunScoped"
"development/navigated" = "RunScoped"
"development/observed" = "RunScoped"
"development/any" = "RunScoped"
"no-module/truth" = "Refuse: registered, no release module"
"no-module/navigated" = "Refuse: registered, no release module"
"no-module/observed" = "Refuse: registered, no release module"
"no-module/any" = "Refuse: registered, no release module"

[golden.classes.j]    # plan 1016: the registry pin line a result report prints under its header
files = ["*.txt"]
match = ['^\+\s*registry: sha256 [0-9a-f]{12}$']
[golden.classes.k]    # plan 1016: the scope line(s) of the units a report used, from the pinned registry projection
files = ["*.txt"]
match = ['^\+\s*scope: ']
