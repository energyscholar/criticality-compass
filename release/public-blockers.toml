[[row]]
name = "history-rehearsal"
state = "closed"
ruling = "A fresh rehearsal of the committed branch tip (a scratch bare copy, rewritten on a copy) passes release/public-verify.sh, V1 to V8. Needs git-filter-repo and gitleaks on PATH and CC_CI_BASELINE (a file of the failure names of release/ci-local.sh on this tip) for V7."
check = '''
set -e
[ -z "$(git status --porcelain)" ] || { echo "the worktree is not clean: the rehearsal is of the committed tip"; exit 1; }
[ -n "${CC_CI_BASELINE:-}" ] && [ -f "${CC_CI_BASELINE:-}" ] || { echo "CC_CI_BASELINE is not set to a file (V7 needs the failure names of this tip)"; exit 1; }
d=$(mktemp -d "${TMPDIR:-/tmp}/turn-public.XXXXXX"); trap 'rm -rf "$d"' EXIT
git clone -q --bare --no-local . "$d/origin.git"
git -C "$d/origin.git" update-ref refs/heads/compass-main "$(git rev-parse HEAD)"
sh release/public-rewrite.sh --origin "$d/origin.git" --out "$d/out.git"
sh release/public-verify.sh "$d/out.git" "$d/origin.git"
'''

