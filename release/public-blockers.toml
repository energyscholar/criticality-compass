# plan 1640 phase 6: the closed table of what stands between this branch and a public repository. One [[row]] per blocker; `release/turn-public-check.sh`
# holds the list of names that must be present (a deleted row is a failure, never a pass). state = closed | open | owner-gated | latent.
#   closed       `check` is a shell command run from the repository root with PY and CC_PRIVATE_PATTERNS exported; exit 0 proves the row. The script runs it; it never reads a result it did not produce.
#   open         work that is not done. The script exits 1 while any row is open.
#   owner-gated  a step only the owner can take, with its recorded ruling. It is listed, never run, and does not fail the check.
#   latent       a finding about something OUTSIDE the public tree (the private toolset, say), with its ruling. It is listed, never run, and does not fail the check.
# The tree scan (public_scan.py --tree) also runs unconditionally inside the script, so no edit of this table can route around it.

[[row]]
name = "1639-handoff"
state = "closed"
ruling = "The 1639 hand-off check exits 0, or exits 1 naming only its own four owner-gated rows: upload-go-0.1.0, repo-url-at-release, plan-numbers-rejudged, opsec-review. Needs CC_RELEASE_TOOLS (a python with build and twine) for its wheel rows."
check = '''
o=$("$PY" release/handoff_check.py 2>&1); rc=$?
[ $rc -eq 0 ] && exit 0
[ $rc -eq 1 ] || { echo "handoff_check exit $rc"; exit 1; }
rest=$(echo "$o" | grep -E '^  [A-Za-z0-9.-]+: ' | grep -v -E '^  (upload-go-0.1.0|repo-url-at-release|plan-numbers-rejudged|opsec-review): ')
[ -z "$rest" ] || { echo "$rest"; exit 1; }
echo "$o" | grep -q -E '^[0-9]+ rows, [0-9]+ problem' || { echo "no summary line"; exit 1; }
'''

