[[row]]
name = "ci-local-macos"
state = "closed"
ruling = "release/ci-local.sh on a fresh clone of this tip, on the macOS host (a commit host's venv, Python 3.11), records this tree's hash, no FAILED line and exit 0. The result file lives outside the tree (it names the tree it was made for): CC_CI_LOCAL_RESULT."
